arm's length. Keep your elbows close to your torso and rotate the palms of your hands until they are facing forward. This will be your starting position.","Now, keeping the upper arms stationary, exhale and curl the weights while contracting your biceps. Continue to raise the weights until your biceps are fully contracted and the dumbbells are at shoulder level. Hold the contracted position for a brief pause as you squeeze your biceps.","Then, inhale and slowly begin to lower the dumbbells back to the starting position.","Repeat for the recommended amount of repetitions."],"s":"sp/Dumbbell_Bicep_Curl.jpg"},{"id":"Dumbbell_Alternate_Bicep_Curl","n":"Curl haltères alterné","c":"Un bras après l'autre, coudes fixes.","m":"Biceps","m2":["Avant-bras"],"e":"Haltères","en":"Dumbbell Alternate Bicep Curl","steps":["Stand (torso upright) with a dumbbell in each hand held at arms length. The elbows should be close to the torso and the palms of your hand should be facing your thighs.","While holding the upper arm stationary, curl the right weight as you rotate the palm of the hands until they are facing forward. At this point continue contracting the biceps as you breathe out until your biceps is fully contracted and the dumbbells are at shoulder level. Hold the contracted position for a second as you squeeze the biceps. Tip: Only the forearms should move.","Slowly begin to bring the dumbbell back to the starting position as your breathe in. Tip: Remember to twist the palms back to the starting position (facing your thighs) as you come down.","Repeat the movement with the left hand. This equals one repetition.","Continue alternating in this manner for the recommended amount of repetitions."],"s":"sp/Dumbbell_Alternate_Bicep_Curl.jpg"},{"id":"Hammer_Curls","n":"Curl marteau","c":"Paumes face à face, monte les haltères.","m":"Biceps","m2":[],"e":"Haltères","en":"Hammer Curls","steps":["Stand up with your torso upright and a dumbbell on each hand being held at arms length. The elbows should be close to the torso.","The palms of the hands should be facing your torso. This will be your starting position.","Now, while holding your upper arm stationary, exhale and curl the weight forward while contracting the biceps. Continue to raise the weight until the biceps are fully contracted and the dumbbell is at shoulder level. Hold the contracted position for a brief moment as you squeeze the biceps. Tip: Focus on keeping the elbow stationary and only moving your forearm.","After the brief pause, inhale and slowly begin the lower the dumbbells back down to the starting position.","Repeat for the recommended amount of repetitions."],"s":"sp/Hammer_Curls.jpg"},{"id":"Incline_Dumbbell_Curl","n":"Curl incliné haltères","c":"Assis sur banc incliné, bras pendants, monte les haltères.","m":"Biceps","m2":[],"e":"Haltères","en":"Incline Dumbbell Curl","steps":["Sit back on an incline bench with a dumbbell in each hand held at arms length. Keep your elbows close to your torso and rotate the palms of your hands until they are facing forward. This will be your starting position.","While holding the upper arm stationary, curl the weights forward while contracting the biceps as you breathe out. Only the forearms should move. Continue the movement until your biceps are fully contracted and the dumbbells are at shoulder level. Hold the contracted position for a second.","Slowly begin to bring the dumbbells back to starting position as your breathe in.","Repeat for the recommended amount of repetitions."],"s":"sp/Incline_Dumbbell_Curl.jpg"},{"id":"Concentration_Curls","n":"Curl concentré","c":"Assis, coude contre l'intérieur de la cuisse, monte l'haltère.","m":"Biceps","m2":["Avant-bras"],"e":"Haltères","en":"Concentration Curls","steps":["Sit down on a flat bench with one dumbbell in front of you between your legs. Your legs should be spread with your knees bent and feet on the floor.","Use your right arm to pick the dumbbell up. Place the back of your right upper arm on the top of your inner right thigh. Rotate the palm of your hand until it is facing forward away from your thigh. Tip: Your arm should be extended and the dumbbell should be above the floor. This will be your starting position.","While holding the upper arm stationary, curl the weights forward while contracting the biceps as you breathe out. Only the forearms should move. Continue the movement until your biceps are fully contracted and the dumbbells are at shoulder level. Tip: At the top of the movement make sure that the little finger of your arm is higher than your thumb. This guarantees a good contraction. Hold the contracted position for a second as you squeeze the biceps.","Slowly begin to bring the dumbbells back to starting position as your breathe in. Caution: Avoid swinging motions at any time.","Repeat for the recommended amount of repetitions. Then repeat the movement with the left arm."],"s":"sp/Concentration_Curls.jpg"},{"id":"Preacher_Curl","n":"Curl pupitre (Larry Scott)","c":"Bras sur le pupitre, monte la barre sans décoller les bras.","m":"Biceps","m2":[],"e":"Barre","en":"Preacher Curl","steps":["To perform this movement you will need a preacher bench and an E-Z bar. Grab the E-Z curl bar at the close inner handle (either have someone hand you the bar which is preferable or grab the bar from the front bar rest provided by most preacher benches). The palm of your hands should be facing forward and they should be slightly tilted inwards due to the shape of the bar.","With the upper arms positioned against the preacher bench pad and the chest against it, hold the E-Z Curl Bar at shoulder length. This will be your starting position.","As you breathe in, slowly lower the bar until your upper arm is extended and the biceps is fully stretched.","As you exhale, use the biceps to curl the weight up until your biceps is fully contracted and the bar is at shoulder height. Squeeze the biceps hard and hold this position for a second.","Repeat for the recommended amount of repetitions."],"s":"sp/Preacher_Curl.jpg"},{"id":"Machine_Preacher_Curls","n":"Curl pupitre machine","c":"Bras sur l'appui, fléchis les coudes.","m":"Biceps","m2":[],"e":"Machine","en":"Machine Preacher Curls","steps":["Sit down on the Preacher Curl Machine and select the weight.","Place the back of your upper arms (your triceps) on the preacher pad provided and grab the handles using an underhand grip (palms facing up). Tip: Make sure that when you place the arms on the pad you keep the elbows in. This will be your starting position.","Now lift the handles as you exhale and you contract the biceps. At the top of the position make sure that you hold the contraction for a second. Tip: Only the forearms should move. The upper arms should remain stationary and on the pad at all times.","Lower the handles slowly back to the starting position as you inhale.","Repeat for the recommended amount of repetitions."],"s":"sp/Machine_Preacher_Curls.jpg"},{"id":"Standing_Biceps_Cable_Curl","n":"Curl poulie basse","c":"Face à la poulie basse, monte la barre coudes fixes.","m":"Biceps","m2":[],"e":"Poulie","en":"Standing Biceps Cable Curl","steps":["Stand up with your torso upright while holding a cable curl bar that is attached to a low pulley. Grab the cable bar at shoulder width and keep the elbows close to the torso. The palm of your hands should be facing up (supinated grip). This will be your starting position.","While holding the upper arms stationary, curl the weights while contracting the biceps as you breathe out. Only the forearms should move. Continue the movement until your biceps are fully contracted and the bar is at shoulder level. Hold the contracted position for a second as you squeeze the muscle.","Slowly begin to bring the curl bar back to starting position as your breathe in.","Repeat for the recommended amount of repetitions."],"s":"sp/Standing_Biceps_Cable_Curl.jpg"},{"id":"Cable_Hammer_Curls_-_Rope_Attachment","n":"Curl marteau à la corde","c":"Corde à la poulie basse, prise neutre.","m":"Biceps","m2":[],"e":"Poulie","en":"Cable Hammer Curls - Rope Attachment","steps":["Attach a rope attachment to a low pulley and stand facing the machine about 12 inches away from it.","Grasp the rope with a neutral (palms-in) grip and stand straight up keeping the natural arch of the back and your torso stationary.","Put your elbows in by your side and keep them there stationary during the entire movement. Tip: Only the forearms should move; not your upper arms. This will be your starting position.","Using your biceps, pull your arms up as you exhale until your biceps touch your forearms. Tip: Remember to keep the elbows in and your upper arms stationary.","After a 1 second contraction where you squeeze your biceps, slowly start to bring the weight back to the original position.","Repeat for the recommended amount of repetitions."],"s":"sp/Cable_Hammer_Curls___Rope_Attachment.jpg"},{"id":"Spider_Curl","n":"Spider curl","c":"Poitrine contre banc incliné, bras pendants, curl.","m":"Biceps","m2":[],"e":"Barre EZ","en":"Spider Curl","steps":["Start out by setting the bar on the part of the preacher bench that you would normally sit on. Make sure to align the barbell properly so that it is balanced and will not fall off.","Move to the front side of the preacher bench (the part where the arms usually lay) and position yourself to lay at a 45 degree slant with your torso and stomach pressed against the front side of the preacher bench.","Make sure that your feet (especially the toes) are well positioned on the floor and place your upper arms on top of the pad located on the inside part of the preacher bench.","Use your arms to grab the barbell with a supinated grip (palms facing up) at about shoulder width apart or slightly closer from each other.","Slowly begin to lift the barbell upwards and exhale. Hold the contracted position for a second as you squeeze the biceps.","Slowly begin to bring the barbell back to the starting position as your breathe in. .","Repeat for the recommended amount of repetitions."],"s":"sp/Spider_Curl.jpg"},{"id":"Reverse_Barbell_Curl","n":"Curl inversé barre","c":"Paumes vers le bas, travaille avant-bras et biceps.","m":"Biceps","m2":["Avant-bras"],"e":"Barre","en":"Reverse Barbell Curl","steps":["Stand up with your torso upright while holding a barbell at shoulder width with the elbows close to the torso. The palm of your hands should be facing down (pronated grip). This will be your starting position.","While holding the upper arms stationary, curl the weights while contracting the biceps as you breathe out. Only the forearms should move. Continue the movement until your biceps are fully contracted and the bar is at shoulder level. Hold the contracted position for a second as you squeeze the muscle.","Slowly begin to bring the bar back to starting position as your breathe in.","Repeat for the recommended amount of repetitions."],"s":"sp/Reverse_Barbell_Curl.jpg"},{"id":"Zottman_Curl","n":"Curl Zottman","c":"Monte paumes vers le haut, tourne et redescends paumes vers le bas.","m":"Biceps","m2":["Avant-bras"],"e":"Haltères","en":"Zottman Curl","steps":["Stand up with your torso upright and a dumbbell in each hand being held at arms length. The elbows should be close to the torso.","Make sure the palms of the hands are facing each other. This will be your starting position.","While holding the upper arm stationary, curl the weights while contracting the biceps as you breathe out. Only the forearms should move. Your wrist should rotate so that you have a supinated (palms up) grip. Continue the movement until your biceps are fully contracted and the dumbbells are at shoulder level.","Hold the contracted position for a second as you squeeze the biceps.","Now during the contracted position, rotate your wrist until you now have a pronated (palms facing down) grip with the thumb at a higher position than the pinky.","Slowly begin to bring the dumbbells back down using the pronated grip.","As the dumbbells close your thighs, start rotating the wrist so that you go back to a neutral (palms facing your body) grip.","Repeat for the recommended amount of repetitions."],"s":"sp/Zottman_Curl.jpg"},{"id":"Triceps_Pushdown","n":"Extension triceps poulie haute (barre)","c":"Coudes collés, pousse la barre vers le bas jusqu'à extension.","m":"Triceps","m2":[],"e":"Poulie","en":"Triceps Pushdown","steps":["Attach a straight or angled bar to a high pulley and grab with an overhand grip (palms facing down) at shoulder width.","Standing upright with the torso straight and a very small inclination forward, bring the upper arms close to your body and perpendicular to the floor. The forearms should be pointing up towards the pulley as they hold the bar. This is your starting position.","Using the triceps, bring the bar down until it touches the front of your thighs and the arms are fully extended perpendicular to the floor. The upper arms should always remain stationary next to your torso and only the forearms should move. Exhale as you perform this movement.","After a second hold at the contracted position, bring the bar slowly up to the starting point. Breathe in as you perform this step.","Repeat for the recommended amount of repetitions."],"s":"sp/Triceps_Pushdown.jpg"},{"id":"Triceps_Pushdown_-_Rope_Attachment","n":"Extension triceps à la corde","c":"Corde à la poulie haute, écarte les mains en bas.","m":"Triceps","m2":[],"e":"Poulie","en":"Triceps Pushdown - Rope Attachment","steps":["Attach a rope attachment to a high pulley and grab with a neutral grip (palms facing each other).","Standing upright with the torso straight and a very small inclination forward, bring the upper arms close to your body and perpendicular to the floor. The forearms should be pointing up towards the pulley as they hold the rope with the palms facing each other. This is your starting position.","Using the triceps, bring the rope down as you bring each side of the rope to the side of your thighs. At the end of the movement the arms are fully extended and perpendicular to the floor. The upper arms should always remain stationary next to your torso and only the forearms should move. Exhale as you perform this movement.","After holding for a second, at the contracted position, bring the rope slowly up to the starting point. Breathe in as you perform this step.","Repeat for the recommended amount of repetitions."],"s":"sp/Triceps_Pushdown___Rope_Attachment.jpg"},{"id":"Reverse_Grip_Triceps_Pushdown","n":"Extension triceps prise inversée","c":"Paumes vers le haut, pousse vers le bas.","m":"Triceps","m2":[],"e":"Poulie","en":"Reverse Grip Triceps Pushdown","steps":["Start by setting a bar attachment (straight or e-z) on a high pulley machine.","Facing the bar attachment, grab it with the palms facing up (supinated grip) at shoulder width. Lower the bar by using your lats until your arms are fully extended by your sides. Tip: Elbows should be in by your sides and your feet should be shoulder width apart from each other. This is the starting position.","Slowly elevate the bar attachment up as you inhale so it is aligned with your chest. Only the forearms should move and the elbows/upper arms should be stationary by your side at all times.","Then begin to lower the cable bar back down to the original staring position while exhaling and contracting the triceps hard.","Repeat for the recommended amount of repetitions."],"s":"sp/Reverse_Grip_Triceps_Pushdown.jpg"},{"id":"Cable_Rope_Overhead_Triceps_Extension","n":"Extension triceps au-dessus de la tête (corde)","c":"Dos à la poulie, tends les bras au-dessus de la tête.","m":"Triceps","m2":[],"e":"Poulie","en":"Cable Rope Overhead Triceps Extension","steps":["Attach a rope to the bottom pulley of the pulley machine.","Grasping the rope with both hands, extend your arms with your hands directly above your head using a neutral grip (palms facing each other). Your elbows should be in close to your head and the arms should be perpendicular to the floor with the knuckles aimed at the ceiling. This will be your starting position.","Slowly lower the rope behind your head as you hold the upper arms stationary. Inhale as you perform this movement and pause when your triceps are fully stretched.","Return to the starting position by flexing your triceps as you breathe out.","Repeat for the recommended amount of repetitions."],"s":"sp/Cable_Rope_Overhead_Triceps_Extension.jpg"},{"id":"EZ-Bar_Skullcrusher","n":"Barre au front","c":"Allongé, descends la barre vers le front en pliant les coudes, remonte.","m":"Triceps","m2":["Avant-bras"],"e":"Barre EZ","en":"EZ-Bar Skullcrusher","steps":["Using a close grip, lift the EZ bar and hold it with your elbows in as you lie on the bench. Your arms should be perpendicular to the floor. This will be your starting position.","Keeping the upper arms stationary, lower the bar by allowing the elbows to flex. Inhale as you perform this portion of the movement. Pause once the bar is directly above the forehead.","Lift the bar back to the starting position by extending the elbow and exhaling.","Repeat."],"s":"sp/EZ_Bar_Skullcrusher.jpg"},{"id":"Lying_Dumbbell_Tricep_Extension","n":"Extension triceps allongé haltères","c":"Allongé, haltères descendus à côté de la tête.","m":"Triceps","m2":["Pectoraux","Épaules"],"e":"Haltères","en":"Lying Dumbbell Tricep Extension","steps":["Lie on a flat bench while holding two dumbbells directly in front of you. Your arms should be fully extended at a 90-degree angle from your torso and the floor. The palms should be facing in and the elbows should be tucked in. This is the starting position.","As you breathe in and you keep the upper arms stationary with the elbows in, slowly lower the weight until the dumbbells are near your ears.","At that point, while keeping the elbows in and the upper arms stationary, use the triceps to bring the weight back up to the starting position as you breathe out.","Repeat for the recommended amount of repetitions."],"s":"sp/Lying_Dumbbell_Tricep_Extension.jpg"},{"id":"Standing_Dumbbell_Triceps_Extension","n":"Extension triceps haltère debout","c":"Haltère à deux mains derrière la tête, tends les bras.","m":"Triceps","m2":[],"e":"Haltères","en":"Standing Dumbbell Triceps Extension","steps":["To begin, stand up with a dumbbell held by both hands. Your feet should be about shoulder width apart from each other. Slowly use both hands to grab the dumbbell and lift it over your head until both arms are fully extended.","The resistance should be resting in the palms of your hands with your thumbs around it. The palm of the hands should be facing up towards the ceiling. This will be your starting position.","Keeping your upper arms close to your head with elbows in and perpendicular to the floor, lower the resistance in a semicircular motion behind your head until your forearms touch your biceps. Tip: The upper arms should remain stationary and only the forearms should move. Breathe in as you perform this step.","Go back to the starting position by using the triceps to raise the dumbbell. Breathe out as you perform this step.","Repeat for the recommended amount of repetitions."],"s":"sp/Standing_Dumbbell_Triceps_Extension.jpg"},{"id":"Seated_Triceps_Press","n":"Extension triceps assis","c":"Assis, haltère derrière la tête, tends les bras.","m":"Triceps","m2":[],"e":"Haltères","en":"Seated Triceps Press","steps":["Sit down on a bench with back support and grasp a dumbbell with both hands and hold it overhead at arm's length. Tip: a better way is to have somebody hand it to you especially if it is very heavy. The resistance should be resting in the palms of your hands with your thumbs around it. The palm of the hand should be facing inward. This will be your starting position.","Keeping your upper arms close to your head (elbows in) and perpendicular to the floor, lower the resistance in a semi-circular motion behind your head until your forearms touch your biceps. Tip: The upper arms should remain stationary and only the forearms should move. Breathe in as you perform this step.","Go back to the starting position by using the triceps to raise the dumbbell. Breathe out as you perform this step.","Repeat for the recommended amount of repetitions."],"s":"sp/Seated_Triceps_Press.jpg"},{"id":"Tricep_Dumbbell_Kickback","n":"Kickback triceps","c":"Buste penché, coude haut, tends l'avant-bras vers l'arrière.","m":"Triceps","m2":[],"e":"Haltères","en":"Tricep Dumbbell Kickback","steps":["Start with a dumbbell in each hand and your palms facing your torso. Keep your back straight with a slight bend in the knees and bend forward at the waist. Your torso should be almost parallel to the floor. Make sure to keep your head up. Your upper arms should be close to your torso and parallel to the floor. Your forearms should be pointed towards the floor as you hold the weights. There should be a 90-degree angle formed between your forearm and upper arm. This is your starting position.","Now, while keeping your upper arms stationary, exhale and use your triceps to lift the weights until the arm is fully extended. Focus on moving the forearm.","After a brief pause at the top contraction, inhale and slowly lower the dumbbells back down to the starting position.","Repeat the movement for the prescribed amount of repetitions."],"s":"sp/Tricep_Dumbbell_Kickback.jpg"},{"id":"Close-Grip_Barbell_Bench_Press","n":"Développé couché prise serrée","c":"Mains largeur d'épaules, coudes près du corps.","m":"Triceps","m2":["Pectoraux","Épaules"],"e":"Barre","en":"Close-Grip Barbell Bench Press","steps":["Lie back on a flat bench. Using a close grip (around shoulder width), lift the bar from the rack and hold it straight over you with your arms locked. This will be your starting position.","As you breathe in, come down slowly until you feel the bar on your middle chest. Tip: Make sure that - as opposed to a regular bench press - you keep the elbows close to the torso at all times in order to maximize triceps involvement.","After a second pause, bring the bar back to the starting position as you breathe out and push the bar using your triceps muscles. Lock your arms in the contracted position, hold for a second and then start coming down slowly again. Tip: It should take at least twice as long to go down than to come up.","Repeat the movement for the prescribed amount of repetitions.","When you are done, place the bar back in the rack."],"s":"sp/Close_Grip_Barbell_Bench_Press.jpg"},{"id":"Dips_-_Triceps_Version","n":"Dips (triceps)","c":"Buste droit, coudes vers l'arrière, descends à 90°.","m":"Triceps","m2":["Pectoraux","Épaules"],"e":"Poids du corps","en":"Dips - Triceps Version","steps":["To get into the starting position, hold your body at arm's length with your arms nearly locked above the bars.","Now, inhale and slowly lower yourself downward. Your torso should remain upright and your elbows should stay close to your body. This helps to better focus on tricep involvement. Lower yourself until there is a 90 degree angle formed between the upper arm and forearm.","Then, exhale and push your torso back up using your triceps to bring your body back to the starting position.","Repeat the movement for the prescribed amount of repetitions."],"s":"sp/Dips___Triceps_Version.jpg"},{"id":"Bench_Dips","n":"Dips entre deux bancs","c":"Mains sur un banc derrière toi, descends en pliant les coudes.","m":"Triceps","m2":["Pectoraux","Épaules"],"e":"Poids du corps","en":"Bench Dips","steps":["For this exercise you will need to place a bench behind your back. With the bench perpendicular to your body, and while looking away from it, hold on to the bench on its edge with the hands fully extended, separated at shoulder width. The legs will be extended forward, bent at the waist and perpendicular to your torso. This will be your starting position.","Slowly lower your body as you inhale by bending at the elbows until you lower yourself far enough to where there is an angle slightly smaller than 90 degrees between the upper arm and the forearm. Tip: Keep the elbows as close as possible throughout the movement. Forearms should always be pointing down.","Using your triceps to bring your torso up again, lift yourself back to the starting position.","Repeat for the recommended amount of repetitions."],"s":"sp/Bench_Dips.jpg"},{"id":"Push-Ups_-_Close_Triceps_Position","n":"Pompes serrées (diamant)","c":"Mains rapprochées sous la poitrine, coudes le long du corps.","m":"Triceps","m2":["Pectoraux","Épaules"],"e":"Poids du corps","en":"Push-Ups - Close Triceps Position","steps":["Lie on the floor face down and place your hands closer than shoulder width for a close hand position. Make sure that you are holding your torso up at arms' length.","Lower yourself until your chest almost touches the floor as you inhale.","Using your triceps and some of your pectoral muscles, press your upper body back up to the starting position and squeeze your chest. Breathe out as you perform this step.","After a second pause at the contracted position, repeat the movement for the prescribed amount of repetitions."],"s":"sp/Push_Ups___Close_Triceps_Position.jpg"},{"id":"Machine_Triceps_Extension","n":"Extension triceps machine","c":"Coudes sur l'appui, tends les bras.","m":"Triceps","m2":[],"e":"Machine","en":"Machine Triceps Extension","steps":["Adjust the seat to the appropriate height and make your weight selection. Place your upper arms against the pads and grasp the handles. This will be your starting position.","Perform the movement by extending the elbow, pulling your lower arm away from your upper arm.","Pause at the completion of the movement, and then slowly return the weight to the starting position.","Avoid returning the weight all the way to the stops until the set is complete to keep tension on the muscles being worked."],"s":"sp/Machine_Triceps_Extension.jpg"},{"id":"Barbell_Squat","n":"Squat barre","c":"Barre sur le haut du dos, descends hanches en arrière, genoux dans l'axe des pieds.","m":"Quadriceps","m2":["Fessiers","Ischios","Lombaires","Mollets"],"e":"Barre","en":"Barbell Squat","steps":["This exercise is best performed inside a squat rack for safety purposes. To begin, first set the bar on a rack to just below shoulder level. Once the correct height is chosen and the bar is loaded, step under the bar and place the back of your shoulders (slightly below the neck) across it.","Hold on to the bar using both arms at each side and lift it off the rack by first pushing with your legs and at the same time straightening your torso.","Step away from the rack and position your legs using a shoulder width medium stance with the toes slightly pointed out. Keep your head up at all times and also maintain a straight back. This will be your starting position. (Note: For the purposes of this discussion we will use the medium stance described above which targets overall development; however you can choose any of the three stances discussed in the foot stances section).","Begin to slowly lower the bar by bending the knees and hips as you maintain a straight posture with the head up. Continue down until the angle between the upper leg and the calves becomes slightly less than 90-degrees. Inhale as you perform this portion of the movement. Tip: If you performed the exercise correctly, the front of the knees should make an imaginary straight line with the toes that is perpendicular to the front. If your knees are past that imaginary line (if they are past your toes) then you are placing undue stress on the knee and the exercise has been performed incorrectly.","Begin to raise the bar as you exhale by pushing the floor with the heel of your foot as you straighten the legs again and go back to the starting position.","Repeat for the recommended amount of repetitions."],"s":"sp/Barbell_Squat.jpg"},{"id":"Barbell_Full_Squat","n":"Squat complet barre","c":"Squat en amplitude complète, dos neutre.","m":"Quadriceps","m2":["Fessiers","Ischios","Lombaires","Mollets"],"e":"Barre","en":"Barbell Full Squat","steps":["This exercise is best performed inside a squat rack for safety purposes. To begin, first set the bar on a rack just above shoulder level. Once the correct height is chosen and the bar is loaded, step under the bar and place the back of your shoulders (slightly below the neck) across it.","Hold on to the bar using both arms at each side and lift it off the rack by first pushing with your legs and at the same time straightening your torso.","Step away from the rack and position your legs using a shoulder-width medium stance with the toes slightly pointed out. Keep your head up at all times and maintain a straight back. This will be your starting position.","Begin to slowly lower the bar by bending the knees and sitting back with your hips as you maintain a straight posture with the head up. Continue down until your hamstrings are on your calves. Inhale as you perform this portion of the movement.","Begin to raise the bar as you exhale by pushing the floor with the heel or middle of your foot as you straighten the legs and extend the hips to go back to the starting position.","Repeat for the recommended amount of repetitions."],"s":"sp/Barbell_Full_Squat.jpg"},{"id":"Front_Barbell_Squat","n":"Squat avant (front squat)","c":"Barre sur l'avant des épaules, buste droit, coudes hauts.","m":"Quadriceps","m2":["Fessiers","Ischios","Mollets"],"e":"Barre","en":"Front Barbell Squat","steps":["This exercise is best performed inside a squat rack for safety purposes. To begin, first set the bar on a rack that best matches your height. Once the correct height is chosen and the bar is loaded, bring your arms up under the bar while keeping the elbows high and the upper arm slightly above parallel to the floor. Rest the bar on top of the deltoids and cross your arms while grasping the bar for total control.","Lift the bar off the rack by first pushing with your legs and at the same time straightening your torso.","Step away from the rack and position your legs using a shoulder width medium stance with the toes slightly pointed out. Keep your head up at all times as looking down will get you off balance and also maintain a straight back. This will be your starting position. (Note: For the purposes of this discussion we will use the medium stance described above which targets overall development; however you can choose any of the three stances described in the foot positioning section).","Begin to slowly lower the bar by bending the knees as you maintain a straight posture with the head up. Continue down until the angle between the upper leg and the calves becomes slightly less than 90-degrees (which is the point in which the upper legs are below parallel to the floor). Inhale as you perform this portion of the movement. Tip: If you performed the exercise correctly, the front of the knees should make an imaginary straight line with the toes that is perpendicular to the front. If your knees are past that imaginary line (if they are past your toes) then you are placing undue stress on the knee and the exercise has been performed incorrectly.","Begin to raise the bar as you exhale by pushing the floor mainly with the middle of your foot as you straighten the legs again and go back to the starting position.","Repeat for the recommended amount of repetitions."],"s":"sp/Front_Barbell_Squat.jpg"},{"id":"Goblet_Squat","n":"Goblet squat","c":"Haltère ou kettlebell contre la poitrine, squat profond buste droit.","m":"Quadriceps","m2":["Fessiers","Ischios","Mollets","Épaules"],"e":"Kettlebell","en":"Goblet Squat","steps":["Stand holding a light kettlebell by the horns close to your chest. This will be your starting position.","Squat down between your legs until your hamstrings are on your calves. Keep your chest and head up and your back straight.","At the bottom position, pause and use your elbows to push your knees out. Return to the starting position, and repeat for 10-20 repetitions."],"s":"sp/Goblet_Squat.jpg"},{"id":"Dumbbell_Squat","n":"Squat haltères","c":"Haltères le long du corps, squat.","m":"Quadriceps","m2":["Fessiers","Ischios","Lombaires","Mollets"],"e":"Haltères","en":"Dumbbell Squat","steps":["Stand up straight while holding a dumbbell on each hand (palms facing the side of your legs).","Position your legs using a shoulder width medium stance with the toes slightly pointed out. Keep your head up at all times as looking down will get you off balance and also maintain a straight back. This will be your starting position. Note: For the purposes of this discussion we will use the medium stance described above which targets overall development; however you can choose any of the three stances discussed in the foot stances section.","Begin to slowly lower your torso by bending the knees as you maintain a straight posture with the head up. Continue down until your thighs are parallel to the floor. Tip: If you performed the exercise correctly, the front of the knees should make an imaginary straight line with the toes that is perpendicular to the front. If your knees are past that imaginary line (if they are past your toes) then you are placing undue stress on the knee and the exercise has been performed incorrectly.","Begin to raise your torso as you exhale by pushing the floor with the heel of your foot mainly as you straighten the legs again and go back to the starting position.","Repeat for the recommended amount of repetitions."],"s":"sp/Dumbbell_Squat.jpg"},{"id":"Bodyweight_Squat","n":"Squat poids du corps","c":"Bras devant, descends en poussant les hanches en arrière.","m":"Quadriceps","m2":["Fessiers","Ischios"],"e":"Poids du corps","en":"Bodyweight Squat","steps":["Stand with your feet shoulder width apart. You can place your hands behind your head. This will be your starting position.","Begin the movement by flexing your knees and hips, sitting back with your hips.","Continue down to full depth if you are able,and quickly reverse the motion until you return to the starting position. As you squat, keep your head and chest up and push your knees out."],"s":"sp/Bodyweight_Squat.jpg"},{"id":"Box_Squat","n":"Box squat","c":"Descends jusqu'à t'asseoir brièvement sur une box, remonte.","m":"Quadriceps","m2":["Adducteurs","Fessiers","Ischios","Lombaires","Mollets"],"e":"Barre","en":"Box Squat","steps":["The box squat allows you to squat to desired depth and develop explosive strength in the squat movement. Begin in a power rack with a box at the appropriate height behind you. Typically, you would aim for a box height that brings you to a parallel squat, but you can train higher or lower if desired.","Begin by stepping under the bar and placing it across the back of the shoulders. Squeeze your shoulder blades together and rotate your elbows forward, attempting to bend the bar across your shoulders. Remove the bar from the rack, creating a tight arch in your lower back, and step back into position. Place your feet wider for more emphasis on the back, glutes, adductors, and hamstrings, or closer together for more quad development. Keep your head facing forward.","With your back, shoulders, and core tight, push your knees and butt out and you begin your descent. Sit back with your hips until you are seated on the box. Ideally, your shins should be perpendicular to the ground. Pause when you reach the box, and relax the hip flexors. Never bounce off of a box.","Keeping the weight on your heels and pushing your feet and knees out, drive upward off of the box as you lead the movement with your head. Continue upward, maintaining tightness head to toe."],"s":"sp/Box_Squat.jpg"},{"id":"Smith_Machine_Squat","n":"Squat Smith machine","c":"Barre guidée, pieds légèrement devant.","m":"Quadriceps","m2":["Fessiers","Ischios","Lombaires","Mollets"],"e":"Machine","en":"Smith Machine Squat","steps":["To begin, first set the bar on the height that best matches your height. Once the correct height is chosen and the bar is loaded, step under the bar and place the back of your shoulders (slightly below the neck) across it.","Hold on to the bar using both arms at each side (palms facing forward), unlock it and lift it off the rack by first pushing with your legs and at the same time straightening your torso.","Position your legs using a shoulder width medium stance with the toes slightly pointed out. Keep your head up at all times and also maintain a straight back. This will be your starting position. (Note: For the purposes of this discussion we will use the medium stance which targets overall development; however you can choose any of the three stances discussed in the foot stances section).","Begin to slowly lower the bar by bending the knees as you maintain a straight posture with the head up. Continue down until the angle between the upper leg and the calves becomes slightly less than 90-degrees (which is the point in which the upper legs are below parallel to the floor). Inhale as you perform this portion of the movement. Tip: If you performed the exercise correctly, the front of the knees should make an imaginary straight line with the toes that is perpendicular to the front. If your knees are past that imaginary line (if they are past your toes) then you are placing undue stress on the knee and the exercise has been performed incorrectly.","Begin to raise the bar as you exhale by pushing the floor with the heel of your foot as you straighten the legs again and go back to the starting position.","Repeat for the recommended amount of repetitions."],"s":"sp/Smith_Machine_Squat.jpg"},{"id":"Hack_Squat","n":"Hack squat machine","c":"Dos contre le dossier, descends jambes fléchies, pousse.","m":"Quadriceps","m2":["Fessiers","Ischios","Mollets"],"e":"Machine","en":"Hack Squat","steps":["Place the back of your torso against the back pad of the machine and hook your shoulders under the shoulder pads provided.","Position your legs in the platform using a shoulder width medium stance with the toes slightly pointed out. Tip: Keep your head up at all times and also maintain the back on the pad at all times.","Place your arms on the side handles of the machine and disengage the safety bars (which on most designs is done by moving the side handles from a facing front position to a diagonal position).","Now straighten your legs without locking the knees. This will be your starting position. (Note: For the purposes of this discussion we will use the medium stance described above which targets overall development; however you can choose any of the three stances described in the foot positioning section).","Begin to slowly lower the unit by bending the knees as you maintain a straight posture with the head up (back on the pad at all times). Continue down until the angle between the upper leg and the calves becomes slightly less than 90-degrees (which is the point in which the upper legs are below parallel to the floor). Inhale as you perform this portion of the movement. Tip: If you performed the exercise correctly, the front of the knees should make an imaginary straight line with the toes that is perpendicular to the front. If your knees are past that imaginary line (if they are past your toes) then you are placing undue stress on the knee and the exercise has been performed incorrectly.","Begin to raise the unit as you exhale by pushing the floor with mainly with the heel of your foot as you straighten the legs again and go back to the starting position.","Repeat for the recommended amount of repetitions."],"s":"sp/Hack_Squat.jpg"},{"id":"Leg_Press","n":"Presse à cuisses","c":"Pieds largeur d'épaules, descends jusqu'à 90°, pousse sans verrouiller.","m":"Quadriceps","m2":["Fessiers","Ischios","Mollets"],"e":"Machine","en":"Leg Press","steps":["Using a leg press machine, sit down on the machine and place your legs on the platform directly in front of you at a medium (shoulder width) foot stance. (Note: For the purposes of this discussion we will use the medium stance described above which targets overall development; however you can choose any of the three stances described in the foot positioning section).","Lower the safety bars holding the weighted platform in place and press the platform all the way up until your legs are fully extended in front of you. Tip: Make sure that you do not lock your knees. Your torso and the legs should make a perfect 90-degree angle. This will be your starting position.","As you inhale, slowly lower the platform until your upper and lower legs make a 90-degree angle.","Pushing mainly with the heels of your feet and using the quadriceps go back to the starting position as you exhale.","Repeat for the recommended amount of repetitions and ensure to lock the safety pins properly once you are done. You do not want that platform falling on you fully loaded."],"s":"sp/Leg_Press.jpg"},{"id":"Leg_Extensions","n":"Leg extension","c":"Assis, tends les jambes, pause en haut, redescends lentement.","m":"Quadriceps","m2":[],"e":"Machine","en":"Leg Extensions","steps":["For this exercise you will need to use a leg extension machine. First choose your weight and sit on the machine with your legs under the pad (feet pointed forward) and the hands holding the side bars. This will be your starting position. Tip: You will need to adjust the pad so that it falls on top of your lower leg (just above your feet). Also, make sure that your legs form a 90-degree angle between the lower and upper leg. If the angle is less than 90-degrees then that means the knee is over the toes which in turn creates undue stress at the knee joint. If the machine is designed that way, either look for another machine or just make sure that when you start executing the exercise you stop going down once you hit the 90-degree angle.","Using your quadriceps, extend your legs to the maximum as you exhale. Ensure that the rest of the body remains stationary on the seat. Pause a second on the contracted position.","Slowly lower the weight back to the original position as you inhale, ensuring that you do not go past the 90-degree angle limit.","Repeat for the recommended amount of times."],"s":"sp/Leg_Extensions.jpg"},{"id":"Lying_Leg_Curls","n":"Leg curl allongé","c":"Allongé sur le ventre, ramène les talons vers les fessiers.","m":"Ischios","m2":[],"e":"Machine","en":"Lying Leg Curls","steps":["Adjust the machine lever to fit your height and lie face down on the leg curl machine with the pad of the lever on the back of your legs (just a few inches under the calves). Tip: Preferably use a leg curl machine that is angled as opposed to flat since an angled position is more favorable for hamstrings recruitment.","Keeping the torso flat on the bench, ensure your legs are fully stretched and grab the side handles of the machine. Position your toes straight (or you can also use any of the other two stances described on the foot positioning section). This will be your starting position.","As you exhale, curl your legs up as far as possible without lifting the upper legs from the pad. Once you hit the fully contracted position, hold it for a second.","As you inhale, bring the legs back to the initial position. Repeat for the recommended amount of repetitions."],"s":"sp/Lying_Leg_Curls.jpg"},{"id":"Seated_Leg_Curl","n":"Leg curl assis","c":"Assis, ramène les talons sous le siège.","m":"Ischios","m2":[],"e":"Machine","en":"Seated Leg Curl","steps":["Adjust the machine lever to fit your height and sit on the machine with your back against the back support pad.","Place the back of lower leg on top of padded lever (just a few inches under the calves) and secure the lap pad against your thighs, just above the knees. Then grasp the side handles on the machine as you point your toes straight (or you can also use any of the other two stances) and ensure that the legs are fully straight right in front of you. This will be your starting position.","As you exhale, pull the machine lever as far as possible to the back of your thighs by flexing at the knees. Keep your torso stationary at all times. Hold the contracted position for a second.","Slowly return to the starting position as you breathe in.","Repeat for the recommended amount of repetitions."],"s":"sp/Seated_Leg_Curl.jpg"},{"id":"Standing_Leg_Curl","n":"Leg curl debout","c":"Une jambe à la fois, ramène le talon vers le fessier.","m":"Ischios","m2":[],"e":"Machine","en":"Standing Leg Curl","steps":["Adjust the machine lever to fit your height and lie with your torso bent at the waist facing forward around 30-45 degrees (since an angled position is more favorable for hamstrings recruitment) with the pad of the lever on the back of your right leg (just a few inches under the calves) and the front of the right leg on top of the machine pad.","Keeping the torso bent forward, ensure your leg is fully stretched and grab the side handles of the machine. Position your toes straight. This will be your starting position.","As you exhale, curl your right leg up as far as possible without lifting the upper leg from the pad. Once you hit the fully contracted position, hold it for a second.","As you inhale, bring the legs back to the initial position. Repeat for the recommended amount of repetitions.","Perform the same exercise now for the left leg."],"s":"sp/Standing_Leg_Curl.jpg"},{"id":"Romanian_Deadlift","n":"Soulevé de terre roumain","c":"Genoux légèrement fléchis, pousse les hanches en arrière, barre le long des cuisses.","m":"Ischios","m2":["Fessiers","Lombaires","Mollets"],"e":"Barre","en":"Romanian Deadlift","steps":["Put a barbell in front of you on the ground and grab it using a pronated (palms facing down) grip that a little wider than shoulder width. Tip: Depending on the weight used, you may need wrist wraps to perform the exercise and also a raised platform in order to allow for better range of motion.","Bend the knees slightly and keep the shins vertical, hips back and back straight. This will be your starting position.","Keeping your back and arms completely straight at all times, use your hips to lift the bar as you exhale. Tip: The movement should not be fast but steady and under control.","Once you are standing completely straight up, lower the bar by pushing the hips back, only slightly bending the knees, unlike when squatting. Tip: Take a deep breath at the start of the movement and keep your chest up. Hold your breath as you lower and exhale as you complete the movement.","Repeat for the recommended amount of repetitions."],"s":"sp/Romanian_Deadlift.jpg"},{"id":"Stiff-Legged_Dumbbell_Deadlift","n":"Soulevé de terre jambes tendues haltères","c":"Jambes presque tendues, dos plat, étire les ischios.","m":"Ischios","m2":["Fessiers","Lombaires"],"e":"Haltères","en":"Stiff-Legged Dumbbell Deadlift","steps":["Grasp a couple of dumbbells holding them by your side at arm's length.","Stand with your torso straight and your legs spaced using a shoulder width or narrower stance. The knees should be slightly bent. This is your starting position.","Keeping the knees stationary, lower the dumbbells to over the top of your feet by bending at the waist while keeping your back straight. Keep moving forward as if you were going to pick something from the floor until you feel a stretch on the hamstrings. Exhale as you perform this movement","Start bringing your torso up straight again by extending your hips and waist until you are back at the starting position. Inhale as you perform this movement.","Repeat for the recommended amount of repetitions."],"s":"sp/Stiff_Legged_Dumbbell_Deadlift.jpg"},{"id":"Sumo_Deadlift","n":"Soulevé de terre sumo","c":"Pieds écartés, mains à l'intérieur des jambes, buste droit.","m":"Ischios","m2":["Adducteurs","Avant-bras","Dos","Fessiers","Lombaires","Quadriceps","Trapèzes"],"e":"Barre","en":"Sumo Deadlift","steps":["Begin with a bar loaded on the ground. Approach the bar so that the bar intersects the middle of the feet. The feet should be set very wide, near the collars. Bend at the hips to grip the bar. The arms should be directly below the shoulders, inside the legs, and you can use a pronated grip, a mixed grip, or hook grip. Relax the shoulders, which in effect lengthens your arms.","Take a breath, and then lower your hips, looking forward with your head with your chest up. Drive through the floor, spreading your feet apart, with your weight on the back half of your feet. Extend through the hips and knees.","As the bar passes through the knees, lean back and drive the hips into the bar, pulling your shoulder blades together.","Return the weight to the ground by bending at the hips and controlling the weight on the way down."],"s":"sp/Sumo_Deadlift.jpg"},{"id":"Dumbbell_Lunges","n":"Fentes avant haltères","c":"Grand pas en avant, genou arrière vers le sol, repousse.","m":"Quadriceps","m2":["Fessiers","Ischios","Mollets"],"e":"Haltères","en":"Dumbbell Lunges","steps":["Stand with your torso upright holding two dumbbells in your hands by your sides. This will be your starting position.","Step forward with your right leg around 2 feet or so from the foot being left stationary behind and lower your upper body down, while keeping the torso upright and maintaining balance. Inhale as you go down. Note: As in the other exercises, do not allow your knee to go forward beyond your toes as you come down, as this will put undue stress on the knee joint. Make sure that you keep your front shin perpendicular to the ground.","Using mainly the heel of your foot, push up and go back to the starting position as you exhale.","Repeat the movement for the recommended amount of repetitions and then perform with the left leg."],"s":"sp/Dumbbell_Lunges.jpg"},{"id":"Barbell_Lunge","n":"Fentes barre","c":"Barre sur le dos, fente avant.","m":"Quadriceps","m2":["Fessiers","Ischios","Mollets"],"e":"Barre","en":"Barbell Lunge","steps":["This exercise is best performed inside a squat rack for safety purposes. To begin, first set the bar on a rack just below shoulder level. Once the correct height is chosen and the bar is loaded, step under the bar and place the back of your shoulders (slightly below the neck) across it.","Hold on to the bar using both arms at each side and lift it off the rack by first pushing with your legs and at the same time straightening your torso.","Step away from the rack and step forward with your right leg and squat down through your hips, while keeping the torso upright and maintaining balance. Inhale as you go down. Note: Do not allow your knee to go forward beyond your toes as you come down, as this will put undue stress on the knee joint. li>","Using mainly the heel of your foot, push up and go back to the starting position as you exhale.","Repeat the movement for the recommended amount of repetitions and then perform with the left leg."],"s":"sp/Barbell_Lunge.jpg"},{"id":"Barbell_Walking_Lunge","n":"Fentes marchées","c":"Enchaîne les fentes en avançant.","m":"Quadriceps","m2":["Fessiers","Ischios","Mollets"],"e":"Barre","en":"Barbell Walking Lunge","steps":["Begin standing with your feet shoulder width apart and a barbell across your upper back.","Step forward with one leg, flexing the knees to drop your hips. Descend until your rear knee nearly touches the ground. Your posture should remain upright, and your front knee should stay above the front foot.","Drive through the heel of your lead foot and extend both knees to raise yourself back up.","Step forward with your rear foot, repeating the lunge on the opposite leg."],"s":"sp/Barbell_Walking_Lunge.jpg"},{"id":"Dumbbell_Rear_Lunge","n":"Fentes arrière haltères","c":"Recule d'un grand pas, descends, reviens.","m":"Quadriceps","m2":["Fessiers","Ischios","Mollets"],"e":"Haltères","en":"Dumbbell Rear Lunge","steps":["Stand with your torso upright holding two dumbbells in your hands by your sides. This will be your starting position.","Step backward with your right leg around two feet or so from the left foot and lower your upper body down, while keeping the torso upright and maintaining balance. Inhale as you go down. Tip: As in the other exercises, do not allow your knee to go forward beyond your toes as you come down, as this will put undue stress on the knee joint. Make sure that you keep your front shin perpendicular to the ground. Keep the torso upright during the lunge; flexible hip flexors are important. A long lunge emphasizes the Gluteus Maximus; a short lunge emphasizes Quadriceps.","Push up and go back to the starting position as you exhale. Tip: Use the ball of your feet to push in order to accentuate the quadriceps. To focus on the glutes, press with your heels.","Now repeat with the opposite leg."],"s":"sp/Dumbbell_Rear_Lunge.jpg"},{"id":"Split_Squat_with_Dumbbells","n":"Squat bulgare / fente statique","c":"Pied arrière (sur un banc pour le bulgare), descends verticalement.","m":"Quadriceps","m2":["Fessiers","Ischios"],"e":"Haltères","en":"Split Squat with Dumbbells","steps":["Position yourself into a staggered stance with the rear foot elevated and front foot forward.","Hold a dumbbell in each hand, letting them hang at the sides. This will be your starting position.","Begin by descending, flexing your knee and hip to lower your body down. Maintain good posture througout the movement. Keep the front knee in line with the foot as you perform the exercise.","At the bottom of the movement, drive through the heel to extend the knee and hip to return to the starting position."],"s":"sp/Split_Squat_with_Dumbbells.jpg"},{"id":"Dumbbell_Step_Ups","n":"Step-up haltères","c":"Monte sur un banc en poussant sur le talon avant.","m":"Quadriceps","m2":["Fessiers","Ischios","Mollets"],"e":"Haltères","en":"Dumbbell Step Ups","steps":["Stand up straight while holding a dumbbell on each hand (palms facing the side of your legs).","Place the right foot on the elevated platform. Step on the platform by extending the hip and the knee of your right leg. Use the heel mainly to lift the rest of your body up and place the foot of the left leg on the platform as well. Breathe out as you execute the force required to come up.","Step down with the left leg by flexing the hip and knee of the right leg as you inhale. Return to the original standing position by placing the right foot of to next to the left foot on the initial position.","Repeat with the right leg for the recommended amount of repetitions and then perform with the left leg."],"s":"sp/Dumbbell_Step_Ups.jpg"},{"id":"Barbell_Hip_Thrust","n":"Hip thrust barre","c":"Haut du dos sur un banc, barre sur les hanches, monte le bassin, serre les fessiers.","m":"Fessiers","m2":["Ischios","Mollets"],"e":"Barre","en":"Barbell Hip Thrust","steps":["Begin seated on the ground with a bench directly behind you. Have a loaded barbell over your legs. Using a fat bar or having a pad on the bar can greatly reduce the discomfort caused by this exercise.","Roll the bar so that it is directly above your hips, and lean back against the bench so that your shoulder blades are near the top of it.","Begin the movement by driving through your feet, extending your hips vertically through the bar. Your weight should be supported by your shoulder blades and your feet. Extend as far as possible, then reverse the motion to return to the starting position."],"s":"sp/Barbell_Hip_Thrust.jpg"},{"id":"Barbell_Glute_Bridge","n":"Pont fessier barre","c":"Au sol, barre sur les hanches, monte le bassin.","m":"Fessiers","m2":["Ischios","Mollets"],"e":"Barre","en":"Barbell Glute Bridge","steps":["Begin seated on the ground with a loaded barbell over your legs. Using a fat bar or having a pad on the bar can greatly reduce the discomfort caused by this exercise. Roll the bar so that it is directly above your hips, and lay down flat on the floor.","Begin the movement by driving through with your heels, extending your hips vertically through the bar. Your weight should be supported by your upper back and the heels of your feet.","Extend as far as possible, then reverse the motion to return to the starting position."],"s":"sp/Barbell_Glute_Bridge.jpg"},{"id":"Single_Leg_Glute_Bridge","n":"Pont fessier une jambe","c":"Une jambe tendue en l'air, monte le bassin sur l'autre.","m":"Fessiers","m2":["Ischios"],"e":"Poids du corps","en":"Single Leg Glute Bridge","steps":["Lay on the floor with your feet flat and knees bent.","Raise one leg off of the ground, pulling the knee to your chest. This will be your starting position.","Execute the movement by driving through the heel, extending your hip upward and raising your glutes off of the ground.","Extend as far as possible, pause and then return to the starting position."],"s":"sp/Single_Leg_Glute_Bridge.jpg"},{"id":"Glute_Kickback","n":"Kickback fessier","c":"À quatre pattes, pousse une jambe vers l'arrière et le haut.","m":"Fessiers","m2":["Ischios"],"e":"Poids du corps","en":"Glute Kickback","steps":["Kneel on the floor or an exercise mat and bend at the waist with your arms extended in front of you (perpendicular to the torso) in order to get into a kneeling push-up position but with the arms spaced at shoulder width. Your head should be looking forward and the bend of the knees should create a 90-degree angle between the hamstrings and the calves. This will be your starting position.","As you exhale, lift up your right leg until the hamstrings are in line with the back while maintaining the 90-degree angle bend. Contract the glutes throughout this movement and hold the contraction at the top for a second. Tip: At the end of the movement the upper leg should be parallel to the floor while the calf should be perpendicular to it.","Go back to the initial position as you inhale and now repeat with the left leg.","Continue to alternate legs until all of the recommended repetitions have been performed."],"s":"sp/Glute_Kickback.jpg"},{"id":"One-Legged_Cable_Kickback","n":"Kickback poulie","c":"Cheville attachée à la poulie basse, pousse la jambe vers l'arrière.","m":"Fessiers","m2":["Ischios"],"e":"Poulie","en":"One-Legged Cable Kickback","steps":["Hook a leather ankle cuff to a low cable pulley and then attach the cuff to your ankle.","Face the weight stack from a distance of about two feet, grasping the steel frame for support.","While keeping your knees and hips bent slightly and your abs tight, contract your glutes to slowly \"kick\" the working leg back in a semicircular arc as high as it will comfortably go as you breathe out. Tip: At full extension, squeeze your glutes for a second in order to achieve a peak contraction.","Now slowly bring your working leg forward, resisting the pull of the cable until you reach the starting position.","Repeat for the recommended amount of repetitions.","Switch legs and repeat the movement for the other side."],"s":"sp/One_Legged_Cable_Kickback.jpg"},{"id":"Pull_Through","n":"Pull-through poulie","c":"Dos à la poulie, corde entre les jambes, extension de hanches.","m":"Fessiers","m2":["Ischios","Lombaires"],"e":"Poulie","en":"Pull Through","steps":["Begin standing a few feet in front of a low pulley with a rope or handle attached. Face away from the machine, straddling the cable, with your feet set wide apart.","Begin the movement by reaching through your legs as far as possible, bending at the hips. Keep your knees slightly bent. Keeping your arms straight, extend through the hip to stand straight up. Avoid pulling upward through the shoulders; all of the motion should originate through the hips."],"s":"sp/Pull_Through.jpg"},{"id":"Thigh_Abductor","n":"Abducteurs machine","c":"Assis, écarte les jambes contre la résistance.","m":"Fessiers","m2":[],"e":"Machine","en":"Thigh Abductor","steps":["To begin, sit down on the abductor machine and select a weight you are comfortable with. When your legs are positioned properly, grip the handles on each side. Your entire upper body (from the waist up) should be stationary. This is the starting position.","Slowly press against the machine with your legs to move them away from each other while exhaling.","Feel the contraction for a second and begin to move your legs back to the starting position while breathing in. Note: Remember to keep your upper body stationary to prevent any injuries from occurring.","Repeat for the recommended amount of repetitions."],"s":"sp/Thigh_Abductor.jpg"},{"id":"Thigh_Adductor","n":"Adducteurs machine","c":"Assis, rapproche les jambes contre la résistance.","m":"Adducteurs","m2":["Fessiers","Ischios"],"e":"Machine","en":"Thigh Adductor","steps":["To begin, sit down on the adductor machine and select a weight you are comfortable with. When your legs are positioned properly on the leg pads of the machine, grip the handles on each side. Your entire upper body (from the waist up) should be stationary. This is the starting position.","Slowly press against the machine with your legs to move them towards each other while exhaling.","Feel the contraction for a second and begin to move your legs back to the starting position while breathing in. Note: Remember to keep your upper body stationary and avoid fast jerking motions in order to prevent any injuries from occurring.","Repeat for the recommended amount of repetitions."],"s":"sp/Thigh_Adductor.jpg"},{"id":"Standing_Calf_Raises","n":"Mollets debout (machine)","c":"Monte sur la pointe des pieds, pause, descends en étirant.","m":"Mollets","m2":[],"e":"Machine","en":"Standing Calf Raises","steps":["Adjust the padded lever of the calf raise machine to fit your height.","Place your shoulders under the pads provided and position your toes facing forward (or using any of the two other positions described at the beginning of the chapter). The balls of your feet should be secured on top of the calf block with the heels extending off it. Push the lever up by extending your hips and knees until your torso is standing erect. The knees should be kept with a slight bend; never locked. Toes should be facing forward, outwards or inwards as described at the beginning of the chapter. This will be your starting position.","Raise your heels as you breathe out by extending your ankles as high as possible and flexing your calf. Ensure that the knee is kept stationary at all times. There should be no bending at any time. Hold the contracted position by a second before you start to go back down.","Go back slowly to the starting position as you breathe in by lowering your heels as you bend the ankles until calves are stretched.","Repeat for the recommended amount of repetitions."],"s":"sp/Standing_Calf_Raises.jpg"},{"id":"Seated_Calf_Raise","n":"Mollets assis","c":"Assis, genoux sous l'appui, monte les talons.","m":"Mollets","m2":[],"e":"Machine","en":"Seated Calf Raise","steps":["Sit on the machine and place your toes on the lower portion of the platform provided with the heels extending off. Choose the toe positioning of your choice (forward, in, or out) as per the beginning of this chapter.","Place your lower thighs under the lever pad, which will need to be adjusted according to the height of your thighs. Now place your hands on top of the lever pad in order to prevent it from slipping forward.","Lift the lever slightly by pushing your heels up and release the safety bar. This will be your starting position.","Slowly lower your heels by bending at the ankles until the calves are fully stretched. Inhale as you perform this movement.","Raise the heels by extending the ankles as high as possible as you contract the calves and breathe out. Hold the top contraction for a second.","Repeat for the recommended amount of repetitions."],"s":"sp/Seated_Calf_Raise.jpg"},{"id":"Calf_Press_On_The_Leg_Press_Machine","n":"Mollets à la presse","c":"Pointes de pieds en bas du plateau, pousse avec les chevilles.","m":"Mollets","m2":[],"e":"Machine","en":"Calf Press On The Leg Press Machine","steps":["Using a leg press machine, sit down on the machine and place your legs on the platform directly in front of you at a medium (shoulder width) foot stance.","Lower the safety bars holding the weighted platform in place and press the platform all the way up until your legs are fully extended in front of you without locking your knees. (Note: In some leg press units you can leave the safety bars on for increased safety. If your leg press unit allows for this, then this is the preferred method of performing the exercise.) Your torso and the legs should make perfect 90-degree angle. Now carefully place your toes and balls of your feet on the lower portion of the platform with the heels extending off. Toes should be facing forward, outwards or inwards as described at the beginning of the chapter. This will be your starting position.","Press on the platform by raising your heels as you breathe out by extending your ankles as high as possible and flexing your calf. Ensure that the knee is kept stationary at all times. There should be no bending at any time. Hold the contracted position by a second before you start to go back down.","Go back slowly to the starting position as you breathe in by lowering your heels as you bend the ankles until calves are stretched.","Repeat for the recommended amount of repetitions."],"s":"sp/Calf_Press_On_The_Leg_Press_Machine.jpg"},{"id":"Standing_Dumbbell_Calf_Raise","n":"Mollets debout haltères","c":"Haltères en main, monte sur la pointe des pieds.","m":"Mollets","m2":[],"e":"Haltères","en":"Standing Dumbbell Calf Raise","steps":["Stand with your torso upright holding two dumbbells in your hands by your sides. Place the ball of the foot on a sturdy and stable wooden board (that is around 2-3 inches tall) while your heels extend off and touch the floor. This will be your starting position.","With the toes pointing either straight (to hit all parts equally), inwards (for emphasis on the outer head) or outwards (for emphasis on the inner head), raise the heels off the floor as you exhale by contracting the calves. Hold the top contraction for a second.","As you inhale, go back to the starting position by slowly lowering the heels.","Repeat for the recommended amount of times."],"s":"sp/Standing_Dumbbell_Calf_Raise.jpg"},{"id":"Glute_Ham_Raise","n":"Glute ham raise","c":"Chevilles bloquées, descends le buste puis remonte avec les ischios.","m":"Ischios","m2":["Fessiers","Mollets"],"e":"Machine","en":"Glute Ham Raise","steps":["Begin by adjusting the equipment to fit your body. Place your feet against the footplate in between the rollers as you lie facedown. Your knees should be just behind the pad.","Start from the bottom of the movement. Keep your back arched as you begin the movement by flexing the knees. Drive your toes into the foot plate as you do so. Keep your upper body straight, and continue until your body is upright.","Return to the starting position, keeping your descent under control."],"s":"sp/Glute_Ham_Raise.jpg"},{"id":"Crunches","n":"Crunch","c":"Allongé genoux fléchis, enroule le haut du dos vers le bassin.","m":"Abdos","m2":[],"e":"Poids du corps","en":"Crunches","steps":["Lie flat on your back with your feet flat on the ground, or resting on a bench with your knees bent at a 90 degree angle. If you are resting your feet on a bench, place them three to four inches apart and point your toes inward so they touch.","Now place your hands lightly on either side of your head keeping your elbows in. Tip: Don't lock your fingers behind your head.","While pushing the small of your back down in the floor to better isolate your abdominal muscles, begin to roll your shoulders off the floor.","Continue to push down as hard as you can with your lower back as you contract your abdominals and exhale. Your shoulders should come up off the floor only about four inches, and your lower back should remain on the floor. At the top of the movement, contract your abdominals hard and keep the contraction for a second. Tip: Focus on slow, controlled movement - don't cheat yourself by using momentum.","After the one second contraction, begin to come down slowly again to the starting position as you inhale.","Repeat for the recommended amount of repetitions."],"s":"sp/Crunches.jpg"},{"id":"Plank","n":"Gainage (planche)","c":"Sur les avant-bras, corps aligné, abdos et fessiers serrés.","m":"Abdos","m2":[],"e":"Poids du corps","en":"Plank","steps":["Get into a prone position on the floor, supporting your weight on your toes and your forearms. Your arms are bent and directly below the shoulder.","Keep your body straight at all times, and hold this position as long as possible. To increase difficulty, an arm or leg can be raised."],"s":"sp/Plank.jpg"},{"id":"Side_Bridge","n":"Gainage latéral","c":"Sur un avant-bras, corps aligné de côté.","m":"Abdos","m2":["Épaules"],"e":"Poids du corps","en":"Side Bridge","steps":[],"s":"sp/Side_Bridge.jpg"},{"id":"Hanging_Leg_Raise","n":"Relevés de jambes suspendu","c":"Suspendu à une barre, monte les jambes sans balancer.","m":"Abdos","m2":[],"e":"Poids du corps","en":"Hanging Leg Raise","steps":["Hang from a chin-up bar with both arms extended at arms length in top of you using either a wide grip or a medium grip. The legs should be straight down with the pelvis rolled slightly backwards. This will be your starting position.","Raise your legs until the torso makes a 90-degree angle with the legs. Exhale as you perform this movement and hold the contraction for a second or so.","Go back slowly to the starting position as you breathe in.","Repeat for the recommended amount of repetitions."],"s":"sp/Hanging_Leg_Raise.jpg"},{"id":"Flat_Bench_Lying_Leg_Raise","n":"Relevés de jambes allongé","c":"Sur un banc, monte les jambes tendues à la verticale.","m":"Abdos","m2":[],"e":"Poids du corps","en":"Flat Bench Lying Leg Raise","steps":["Lie with your back flat on a bench and your legs extended in front of you off the end.","Place your hands either under your glutes with your palms down or by the sides holding on to the bench. This will be your starting position.","As you keep your legs extended, straight as possible with your knees slightly bent but locked raise your legs until they make a 90-degree angle with the floor. Exhale as you perform this portion of the movement and hold the contraction at the top for a second.","Now, as you inhale, slowly lower your legs back down to the starting position."],"s":"sp/Flat_Bench_Lying_Leg_Raise.jpg"},{"id":"Reverse_Crunch","n":"Crunch inversé","c":"Allongé, ramène les genoux vers la poitrine en décollant le bassin.","m":"Abdos","m2":[],"e":"Poids du corps","en":"Reverse Crunch","steps":["Lie down on the floor with your legs fully extended and arms to the side of your torso with the palms on the floor. Your arms should be stationary for the entire exercise.","Move your legs up so that your thighs are perpendicular to the floor and feet are together and parallel to the floor. This is the starting position.","While inhaling, move your legs towards the torso as you roll your pelvis backwards and you raise your hips off the floor. At the end of this movement your knees will be touching your chest.","Hold the contraction for a second and move your legs back to the starting position while exhaling.","Repeat for the recommended amount of repetitions."],"s":"sp/Reverse_Crunch.jpg"},{"id":"Cable_Crunch","n":"Crunch à la poulie","c":"À genoux, corde derrière la tête, enroule le buste vers le sol.","m":"Abdos","m2":[],"e":"Poulie","en":"Cable Crunch","steps":["Kneel below a high pulley that contains a rope attachment.","Grasp cable rope attachment and lower the rope until your hands are placed next to your face.","Flex your hips slightly and allow the weight to hyperextend the lower back. This will be your starting position.","With the hips stationary, flex the waist as you contract the abs so that the elbows travel towards the middle of the thighs. Exhale as you perform this portion of the movement and hold the contraction for a second.","Slowly return to the starting position as you inhale. Tip: Make sure that you keep constant tension on the abs throughout the movement. Also, do not choose a weight so heavy that the lower back handles the brunt of the work.","Repeat for the recommended amount of repetitions."],"s":"sp/Cable_Crunch.jpg"},{"id":"Ab_Roller","n":"Roue abdominale","c":"À genoux, roule vers l'avant en gardant le dos neutre, reviens.","m":"Abdos","m2":["Épaules"],"e":"Autre","en":"Ab Roller","steps":["Hold the Ab Roller with both hands and kneel on the floor.","Now place the ab roller on the floor in front of you so that you are on all your hands and knees (as in a kneeling push up position). This will be your starting position.","Slowly roll the ab roller straight forward, stretching your body into a straight position. Tip: Go down as far as you can without touching the floor with your body. Breathe in during this portion of the movement.","After a pause at the stretched position, start pulling yourself back to the starting position as you breathe out. Tip: Go slowly and keep your abs tight at all times."],"s":"sp/Ab_Roller.jpg"},{"id":"Russian_Twist","n":"Rotations russes","c":"Assis buste incliné, tourne le buste d'un côté à l'autre.","m":"Abdos","m2":["Lombaires"],"e":"Poids du corps","en":"Russian Twist","steps":["Lie down on the floor placing your feet either under something that will not move or by having a partner hold them. Your legs should be bent at the knees.","Elevate your upper body so that it creates an imaginary V-shape with your thighs. Your arms should be fully extended in front of you perpendicular to your torso and with the hands clasped. This is the starting position.","Twist your torso to the right side until your arms are parallel with the floor while breathing out.","Hold the contraction for a second and move back to the starting position while breathing out. Now move to the opposite side performing the same techniques you applied to the right side.","Repeat for the recommended amount of repetitions."],"s":"sp/Russian_Twist.jpg"},{"id":"Sit-Up","n":"Sit-up","c":"Remonte le buste jusqu'aux genoux, redescends contrôlé.","m":"Abdos","m2":[],"e":"Poids du corps","en":"Sit-Up","steps":["Lie down on the floor placing your feet either under something that will not move or by having a partner hold them. Your legs should be bent at the knees.","Place your hands behind your head and lock them together by clasping your fingers. This is the starting position.","Elevate your upper body so that it creates an imaginary V-shape with your thighs. Breathe out when performing this part of the exercise.","Once you feel the contraction for a second, lower your upper body back down to the starting position while inhaling.","Repeat for the recommended amount of repetitions."],"s":"sp/Sit_Up.jpg"},{"id":"Dead_Bug","n":"Dead bug","c":"Sur le dos, tends bras et jambe opposés en gardant le bas du dos au sol.","m":"Abdos","m2":[],"e":"Poids du corps","en":"Dead Bug","steps":["Begin lying on your back with your hands extended above you toward the ceiling.","Bring your feet, knees, and hips up to 90 degrees.","Exhale hard to bring your ribcage down and flatten your back onto the floor, rotating your pelvis up and squeezing your glutes. Hold this position throughout the movement. This will be your starting position.","Initiate the exercise by extending one leg, straightening the knee and hip to bring the leg just above the ground.","Maintain the position of your lumbar and pelvis as you perform the movement, as your back is going to want to arch.","Stay tight and return the working leg to the starting position.","Repeat on the opposite side, alternating until the set is complete."],"s":"sp/Dead_Bug.jpg"},{"id":"Pallof_Press","n":"Pallof press","c":"De profil à la poulie, pousse la poignée devant toi sans tourner.","m":"Abdos","m2":["Pectoraux","Triceps","Épaules"],"e":"Poulie","en":"Pallof Press","steps":["Connect a standard handle to a tower, and—if possible—position the cable to shoulder height. If not, a low pulley will suffice.","With your side to the cable, grab the handle with both hands and step away from the tower. You should be approximately arm's length away from the pulley, with the tension of the weight on the cable.","With your feet positioned hip-width apart and knees slightly bent, hold the cable to the middle of your chest. This will be your starting position.","Press the cable away from your chest, fully extending both arms. You core should be tight and engaged.","Hold the repetition for several seconds before returning to the starting position.","At the conclusion of the set, repeat facing the other direction."],"s":"sp/Pallof_Press.jpg"},{"id":"Standing_Cable_Wood_Chop","n":"Bûcheron à la poulie","c":"Tire la poignée en diagonale de haut en bas en tournant le buste.","m":"Abdos","m2":["Épaules"],"e":"Poulie","en":"Standing Cable Wood Chop","steps":["Connect a standard handle to a tower, and move the cable to the highest pulley position.","With your side to the cable, grab the handle with one hand and step away from the tower. You should be approximately arm's length away from the pulley, with the tension of the weight on the cable. Your outstretched arm should be aligned with the cable.","With your feet positioned shoulder width apart, reach upward with your other hand and grab the handle with both hands. Your arms should still be fully extended.","In one motion, pull the handle down and across your body to your front knee while rotating your torso.","Keep your back and arms straight and core tight while you pivot your back foot and bend your knees to get a full range of motion.","Maintain your stance and straight arms. Return to the neutral position in a slow and controlled manner.","Repeat to failure.","Then, reposition and repeat the same series of movements on the opposite side."],"s":"sp/Standing_Cable_Wood_Chop.jpg"},{"id":"Ab_Crunch_Machine","n":"Crunch machine","c":"Enroule le buste contre la résistance.","m":"Abdos","m2":[],"e":"Machine","en":"Ab Crunch Machine","steps":["Select a light resistance and sit down on the ab machine placing your feet under the pads provided and grabbing the top handles. Your arms should be bent at a 90 degree angle as you rest the triceps on the pads provided. This will be your starting position.","At the same time, begin to lift the legs up as you crunch your upper torso. Breathe out as you perform this movement. Tip: Be sure to use a slow and controlled motion. Concentrate on using your abs to move the weight while relaxing your legs and feet.","After a second pause, slowly return to the starting position as you breathe in.","Repeat the movement for the prescribed amount of repetitions."],"s":"sp/Ab_Crunch_Machine.jpg"},{"id":"Oblique_Crunches_-_On_The_Floor","n":"Crunch obliques","c":"Allongé sur le côté, enroule vers la hanche.","m":"Abdos","m2":[],"e":"Poids du corps","en":"Oblique Crunches - On The Floor","steps":["Start out by lying on your right side with your legs lying on top of each other. Make sure your knees are bent a little bit.","Place your left hand behind your head.","Once you are in this set position, begin by moving your left elbow up as you would perform a normal crunch except this time the main emphasis is on your obliques.","Crunch as high as you can, hold the contraction for a second and then slowly drop back down into the starting position.","Remember to breathe in during the eccentric (lowering) part of the exercise and to breathe out during the concentric (elevation) part of the exercise."],"s":"sp/Oblique_Crunches___On_The_Floor.jpg"},{"id":"Dumbbell_Side_Bend","n":"Flexions latérales haltère","c":"Haltère d'un côté, penche-toi sur le côté puis remonte.","m":"Abdos","m2":[],"e":"Haltères","en":"Dumbbell Side Bend","steps":["Stand up straight while holding a dumbbell on the left hand (palms facing the torso) as you have the right hand holding your waist. Your feet should be placed at shoulder width
