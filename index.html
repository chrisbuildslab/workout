. This will be your starting position.","While keeping your back straight and your head up, bend only at the waist to the right as far as possible. Breathe in as you bend to the side. Then hold for a second and come back up to the starting position as you exhale. Tip: Keep the rest of the body stationary.","Now repeat the movement but bending to the left instead. Hold for a second and come back to the starting position.","Repeat for the recommended amount of repetitions and then change hands."],"s":"sp/Dumbbell_Side_Bend.jpg"},{"id":"Palms-Up_Barbell_Wrist_Curl_Over_A_Bench","n":"Curl poignets barre","c":"Avant-bras sur un banc, monte la barre avec les poignets.","m":"Avant-bras","m2":[],"e":"Barre","en":"Palms-Up Barbell Wrist Curl Over A Bench","steps":["Start out by placing a barbell on one side of a flat bench.","Kneel down on both of your knees so that your body is facing the flat bench.","Use your arms to grab the barbell with a supinated grip (palms up) and bring them up so that your forearms are resting against the flat bench. Your wrists should be hanging over the edge.","Start out by curling your wrist upwards and exhaling.","Slowly lower your wrists back down to the starting position while inhaling.","Your forearms should be stationary as your wrist is the only movement needed to perform this exercise.","Repeat for the recommended amount of repetitions."],"s":"sp/Palms_Up_Barbell_Wrist_Curl_Over_A_Bench.jpg"},{"id":"Palms-Down_Wrist_Curl_Over_A_Bench","n":"Extension des poignets barre","c":"Paumes vers le bas, monte la barre avec les poignets.","m":"Avant-bras","m2":[],"e":"Barre","en":"Palms-Down Wrist Curl Over A Bench","steps":["Start out by placing a barbell on one side of a flat bench.","Kneel down on both of your knees so that your body is facing the flat bench.","Use your arms to grab the barbell with a pronated grip (palms down) and bring them up so that your forearms are resting against the flat bench. Your wrists should be hanging over the edge.","Start out by curling your wrist upwards and exhaling.","Slowly lower your wrists back down to the starting position while inhaling.","Your forearms should be stationary as your wrist is the only movement needed to perform this exercise.","Repeat for the recommended amount of repetitions."],"s":"sp/Palms_Down_Wrist_Curl_Over_A_Bench.jpg"},{"id":"Wrist_Roller","n":"Rouleau à poignets","c":"Enroule la corde du poids en tournant la barre.","m":"Avant-bras","m2":["Épaules"],"e":"Autre","en":"Wrist Roller","steps":["To begin, stand straight up grabbing a wrist roller using a pronated grip (palms facing down). Your feet should be shoulder width apart.","Slowly lift both arms until they are fully extended and parallel to the floor in front of you. Note: Make sure the rope is not wrapped around the roller. Your entire body should be stationary except for the forearms. This is the starting position.","Rotate one wrist at a time in an upward motion to bring the weight up to the bar by rolling the rope around the roller.","Once the weight has reached the bar, slowly begin to lower the weight back down by rotating the wrist in a downward motion until the weight reaches the starting position.","Repeat for the prescribed amount of repetitions in your program."],"s":"sp/Wrist_Roller.jpg"}]</script>

/* ---------- state ---------- */
const S = { programs:[], activeId:null, settings:{theme:'auto'}, custom:[], logs:[], current:null };
const V = { tab:'today', edit:null, month:null, selDay:null, openLog:null };
const LS = 'muscu.v1', LSD = 'muscu.dirty';
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,7);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const $ = s => document.querySelector(s);
const num = v => { const n = parseFloat(String(v).replace(',', '.')); return isFinite(n) ? n : null; };
const fmtW = w => (w === null || w === undefined || w === '') ? '' : String(w).replace('.', ',');

function lsLoad(){ try{ const j = JSON.parse(localStorage.getItem(LS) || 'null'); if (j) Object.assign(S, j); }catch(e){} }
function lsSave(){ try{ localStorage.setItem(LS, JSON.stringify(S)); }catch(e){} }
function dirtyGet(){ try{ return new Set(JSON.parse(localStorage.getItem(LSD) || '[]')); }catch(e){ return new Set(); } }
function dirtySet(set){ try{ localStorage.setItem(LSD, JSON.stringify([...set])); }catch(e){} }

/* ---------- remote storage (user's private db, artifact only) ---------- */
let col = null, sync = 'wait', flushing = false, flushTimer = null;
const dirty = dirtyGet();
function allKeys(){ return ['state','current', ...S.custom.map(e => 'ex_'+e.id), ...S.logs.map(l => 'log_'+l.id)]; }
function docBody(k){
  if (k === 'state') return { programs:S.programs, activeId:S.activeId, settings:S.settings, v:1 };
  if (k === 'current') return S.current ? { w:S.current } : null;
  if (k.startsWith('ex_')){ const e = S.custom.find(x => 'ex_'+x.id === k); return e ? { e } : null; }
  if (k.startsWith('log_')){ const l = S.logs.find(x => 'log_'+x.id === k); return l ? { l } : null; }
  return null;
}
function persist(...keys){
  lsSave();
  keys.flat().forEach(k => dirty.add(k)); dirtySet(dirty);
  if (!col) return;
  clearTimeout(flushTimer); flushTimer = setTimeout(flush, 700);
}
async function flush(){
  if (!col || !dirty.size) return;
  if (flushing){ clearTimeout(flushTimer); flushTimer = setTimeout(flush, 600); return; }
  flushing = true; let failed = false;
  try{
    for (const k of [...dirty]){
      const b = docBody(k), ref = col.doc(k);
      try{
        if (b) await ref.set(b); else await ref.delete();
        dirty.delete(k); dirtySet(dirty);
      }catch(e){
        failed = true;
        if (e && e.code === 'quota_exceeded') toast("Stockage plein : supprime d'anciennes séances.");
        if (e && (e.code === 'invalid_argument' || e.code === 'revoked')){ dirty.delete(k); dirtySet(dirty); }
        break;
      }
    }
  } finally { flushing = false; }
  setSync(failed ? 'off' : 'ok');
  if (failed){ clearTimeout(flushTimer); flushTimer = setTimeout(flush, 8000 + Math.random()*4000); }
}
function setSync(s){ sync = s; const d = $('#syncdot'); if (d) d.className = 'dot ' + (s==='ok'?'ok':s==='off'?'off':''); }
function applyRemote(docs){
  const keep = JSON.parse(JSON.stringify(S));
  const st = docs.find(d => d.id === 'state');
  if (st){ const b = st.data(); S.programs = b.programs || []; S.activeId = b.activeId || null; S.settings = Object.assign({theme:'auto'}, b.settings || {}); }
  const cur = docs.find(d => d.id === 'current'); S.current = cur ? (cur.data().w || null) : null;
  S.custom = docs.filter(d => d.id.startsWith('ex_')).map(d => d.data().e).filter(Boolean);
  S.logs = docs.filter(d => d.id.startsWith('log_')).map(d => d.data().l).filter(Boolean);
  // local changes not yet synced win over remote
  for (const k of dirty){
    if (k === 'state'){ S.programs = keep.programs; S.activeId = keep.activeId; S.settings = keep.settings; }
    else if (k === 'current') S.current = keep.current;
    else if (k.startsWith('ex_')){ const id = k.slice(3); S.custom = S.custom.filter(x => x.id !== id); const e = keep.custom.find(x => x.id === id); if (e) S.custom.push(e); }
    else if (k.startsWith('log_')){ const id = k.slice(4); S.logs = S.logs.filter(x => x.id !== id); const l = keep.logs.find(x => x.id === id); if (l) S.logs.push(l); }
  }
  sortLogs();
}
async function initRemote(){
  const timeout = setTimeout(() => { if (sync === 'wait') setSync('off'); }, 10000);
  try{
    if (!window.claude || !claude.use){ setSync('local'); return; }
    const [db, user] = await Promise.all([claude.use('db'), claude.use('user')]);
    const id = user ? await user.id() : null;
    if (!db || !id){ setSync('local'); return; }
    col = db.collection('data/users/' + id);
    const snap = await col.get();
    if (snap.empty){ allKeys().forEach(k => dirty.add(k)); dirtySet(dirty); }
    else { applyRemote(snap.docs); lsSave(); applyTheme(); render(); }
    setSync('ok'); flush();
  }catch(e){ setSync('off'); }
  finally{ clearTimeout(timeout); }
}
async function refreshRemote(){
  if (!col || dirty.size || flushing) { flush(); return; }
  if ($('#sheet').innerHTML || document.activeElement?.tagName === 'INPUT') return;
  try{ const snap = await col.get(); applyRemote(snap.docs); lsSave(); render(); setSync('ok'); }catch(e){}
}
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') refreshRemote(); });
window.addEventListener('online', flush);

/* ---------- helpers ---------- */
const sortLogs = () => S.logs.sort((a,b) => b.start - a.start);
const allEx = () => [...EX_BASE, ...S.custom];
const exById = id => EX_BASE.find(e => e.id === id) || S.custom.find(e => e.id === id) || { id, n:'Exercice supprimé', m:'Autre', e:'', img:[] };
const activeProg = () => S.programs.find(p => p.id === S.activeId) || null;
function thumb(ex){
  if (ex.photo) return `<img class="thumb" src="${esc(ex.photo)}" alt="">`;
  if (ex.s) return `<div class="thumb spr" style="background-image:url('${esc(ex.s)}')"></div>`;
  return `<div class="thumb ph">${esc((ex.n||'?')[0])}</div>`;
}
function lastPerf(exId, skipId){
  for (const l of S.logs){
    if (l.id === skipId) continue;
    const it = l.items.find(i => i.exId === exId && i.sets.some(s => s.done));
    if (it) return { date:l.start, sets:it.sets.filter(s => s.done) };
  }
  return null;
}
function perfStr(sets){ return sets.map(s => (s.w !== null && s.w !== '' && s.w !== undefined) ? `${fmtW(s.w)} kg × ${s.r ?? '?'}` : `${s.r ?? '?'} reps`).join(' · '); }
const cap = s => s.charAt(0).toUpperCase() + s.slice(1);
const dShort = t => new Date(t).toLocaleDateString('fr-FR', { day:'numeric', month:'short' });
const dLong = t => new Date(t).toLocaleDateString('fr-FR', { weekday:'long', day:'numeric', month:'long' });
const dayKey = t => { const d = new Date(t); return `${d.getFullYear()}-${d.getMonth()+1}-${d.getDate()}`; };
function dur(ms){ const m = Math.round(ms/60000); return m < 60 ? `${m} min` : `${Math.floor(m/60)} h ${String(m%60).padStart(2,'0')}`; }
function restLbl(s){ return s < 60 ? `${s} s` : (s % 60 ? `${Math.floor(s/60)} min ${s%60}` : `${s/60} min`); }
function firstReps(r){ const n = parseInt(String(r)); return isFinite(n) ? n : null; }
function toast(msg){ const t = $('#toast'); t.innerHTML = `<div class="toast">${esc(msg)}</div>`; clearTimeout(toast.t); toast.t = setTimeout(() => t.innerHTML = '', 2600); }
function applyTheme(){ const t = S.settings.theme; if (t === 'dark' || t === 'light') document.documentElement.dataset.theme = t; else delete document.documentElement.dataset.theme; }

/* ---------- rendering ---------- */
function header(title, opts={}){
  $('#top').innerHTML = `${opts.back ? `<button class="iconbtn" data-a="${opts.back}" aria-label="Retour">${I.back}</button>` : ''}
    <h1>${esc(title)}</h1><span id="syncdot" class="dot ${sync==='ok'?'ok':sync==='off'?'off':''}" title="Synchronisation"></span>
    <button class="iconbtn" data-a="settings" aria-label="Réglages">${I.gear}</button>`;
}
function tabs(){
  const t = [['today','Séance',I.today],['prog','Programmes',I.prog],['lib','Exercices',I.lib],['hist','Historique',I.hist]];
  $('#tabs').innerHTML = t.map(([k,l,ic]) => `<button class="tab ${V.tab===k?'on':''}" data-a="tab" data-v="${k}">${ic}<span>${l}</span></button>`).join('');
}
function render(){
  tabs();
  const m = $('#main');
  if (V.tab === 'today') S.current ? renderWorkout(m) : renderToday(m);
  else if (V.tab === 'prog') V.edit ? renderEditor(m) : renderPrograms(m);
  else if (V.tab === 'lib') renderLib(m);
  else renderHist(m);
}

/* --- Today / workout --- */
function renderToday(m){
  header('Séance');
  const p = activeProg();
  if (!p){
    m.innerHTML = `<div class="card empty"><h2>Aucun programme actif</h2><p class="muted">Crée ton programme, ajoute tes séances et tes exercices, puis lance l'entraînement d'ici.</p><button class="btn primary" data-a="newprog">Créer un programme</button>
      ${S.programs.length ? `<div class="sp"></div><button class="btn" data-a="tab" data-v="prog">Choisir dans l'archive</button>` : ''}</div>`;
    return;
  }
  const days = p.days.map(d => {
    const last = S.logs.find(l => l.programId === p.id && l.dayId === d.id);
    const names = d.items.map(i => exById(i.exId).n);
    return `<div class="card daycard">
      <div class="row"><div class="grow"><h3>${esc(d.name || 'Séance')}</h3>
      <div class="ex">${names.length ? esc(names.slice(0,4).join(' · ')) + (names.length>4 ? ` +${names.length-4}` : '') : 'Aucun exercice'}</div>
      <div class="tiny muted" style="margin-top:6px">${d.items.length} exercice${d.items.length>1?'s':''}${last ? ' · dernière fois ' + dShort(last.start) : ''}</div></div></div>
      <div class="sp"></div>
      <button class="btn primary block" data-a="start" data-d="${d.id}" ${d.items.length?'':'disabled style="opacity:.5"'}>Commencer</button></div>`;
  }).join('');
  m.innerHTML = `<div class="row" style="margin:0 2px 12px"><div class="grow"><span class="pill acc">Programme actif</span> <b style="margin-left:4px">${esc(p.name)}</b></div>
    <button class="btn sm" data-a="edit" data-p="${p.id}">Modifier</button></div>
    ${days || `<div class="card empty"><p class="muted">Ce programme n'a pas encore de séance.</p><button class="btn primary" data-a="edit" data-p="${p.id}">Ajouter une séance</button></div>`}`;
}

function startWorkout(dayId){
  const p = activeProg(); const d = p && p.days.find(x => x.id === dayId); if (!d) return;
  S.current = { id:uid(), programId:p.id, programName:p.name, dayId:d.id, dayName:d.name, start:Date.now(),
    items: d.items.map(it => {
      const lp = lastPerf(it.exId);
      const n = Math.max(1, parseInt(it.sets) || 3);
      const sets = Array.from({length:n}, (_, i) => {
        const ref = lp ? (lp.sets[i] || lp.sets[lp.sets.length-1]) : null;
        return { w: ref ? ref.w : null, r: ref ? ref.r : firstReps(it.reps), done:false };
      });
      return { exId:it.exId, target:{ sets:n, reps:it.reps, rest:it.rest || 90 }, sets };
    }) };
  persist('current'); window.scrollTo(0,0); render();
}

function renderWorkout(m){
  const w = S.current;
  header(w.dayName || 'Séance');
  const done = w.items.reduce((a,i) => a + i.sets.filter(s => s.done).length, 0);
  const total = w.items.reduce((a,i) => a + i.sets.length, 0);
  m.innerHTML = `<div class="wk-head"><span class="muted small">${esc(w.programName)} · démarrée à ${new Date(w.start).toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'})}</span><span class="small"><b>${done}</b>/${total} séries</span></div>` +
  w.items.map((it, i) => {
    const ex = exById(it.exId); const lp = lastPerf(it.exId, w.id);
    return `<div class="card">
      <div class="row"><button data-a="ex" data-e="${esc(ex.id)}">${thumb(ex)}</button>
        <div class="grow"><div style="font-weight:700">${esc(ex.n)}</div>
        <div class="small muted">${it.target.sets} × ${esc(it.target.reps || '?')} · repos ${restLbl(it.target.rest)}</div>
        <div class="last">${lp ? `Dernière fois (${dShort(lp.date)}) : <b>${esc(perfStr(lp.sets))}</b>` : 'Première fois sur cet exercice'}</div></div></div>
      <table class="sets"><tr><th>#</th><th>kg</th><th>reps</th><th></th></tr>
      ${it.sets.map((s, j) => `<tr class="${s.done?'done':''}"><td>${j+1}</td>
        <td><input inputmode="decimal" data-f="w" data-i="${i}" data-j="${j}" value="${esc(fmtW(s.w))}" placeholder="–"></td>
        <td><input inputmode="numeric" data-f="r" data-i="${i}" data-j="${j}" value="${esc(s.r ?? '')}" placeholder="–"></td>
        <td style="width:48px"><button class="check" data-a="toggle" data-i="${i}" data-j="${j}" aria-label="Série faite">${I.check}</button></td></tr>`).join('')}
      </table>
      <div class="row" style="margin-top:8px;justify-content:flex-end"><button class="btn sm" data-a="delset" data-i="${i}">− série</button><button class="btn sm" data-a="addset" data-i="${i}">+ série</button></div>
    </div>`;
  }).join('') +
  `<button class="btn primary block" data-a="finish">Terminer la séance</button><div class="sp"></div>
   <button class="btn block danger" data-a="abandon">Abandonner</button>`;
}

/* --- Programs --- */
function progSummary(p){ return p.days.length ? p.days.map(d => esc(d.name || 'Séance')).join(' · ') : 'Aucune séance'; }
function renderPrograms(m){

    `<div class="section-title">Archive</div>` +
    (arch.length ? arch.map(a => `<div class="card"><div style="font-weight:700">${esc(a.name)}</div><div class="small muted" style="margin-top:2px">${progSummary(a)}</div>

          <div class="ord"><button data-a="itdel" data-di="${di}" data-ii="${ii}" aria-label="Retirer">${I.close}</button></div></div>
        <div class="mini"><div><label>Séries</label><input inputmode="numeric" data-if="sets" data-di="${di}" data-ii="${ii}" value="${esc(it.sets)}"></div>
          <div><label>Reps</label><input data-if="reps" data-di="${di}" data-ii="${ii}" value="${esc(it.reps)}" placeholder="8-10"></div>
          <div><label>Repos</label><select data-if="rest" data-di="${di}" data-ii="${ii}">${RESTS.map(r => `<option value="${r}" ${+it.rest===r?'selected':''}>${restLbl(r)}</option>`).join('')}</select></div></div>
      </div>`; }).join('')}</div>
      <div class="sp"></div><button class="btn block" data-a="pick" data-di="${di}">+ Ajouter des exercices</button></div>`).join('') +
    `<div class="sp"></div><button class="btn block primary" data-a="addday">+ Ajouter une séance</button>
     ${p.id !== S.activeId ? `<div class="sp"></div><button class="btn block" data-a="activate" data-p="${p.id}">Définir comme programme actif</button>` : ''}`;
}

/* --- Exercise library --- */
function groupByMuscle(list){
  const g = {}; for (const e of list){ (g[e.m] = g[e.m] || []).push(e); }
  return MUSCLES.filter(mu => g[mu]).map(mu => [mu, g[mu].sort((a,b) => a.n.localeCompare(b.n,'fr'))]);
}
function exListHTML(picking){
  const groups = groupByMuscle(allEx());
  return `<div class="chips">${groups.map(([mu]) => `<button class="chip" data-a="jump" data-v="${esc(mu)}">${esc(mu)}</button>`).join('')}</div>` +
    groups.map(([mu, list]) => `<div class="section-title" id="mu-${picking?'p-':''}${esc(mu)}">${esc(mu)}</div><div class="card" style="padding:4px 14px">` +
      list.map(e => `<div class="list-item"><button data-a="ex" data-e="${esc(e.id)}">${thumb(e)}</button>

        ${picking ? `<button class="pick ${PICK.has(e.id)?'on':''}" data-a="toggpick" data-e="${esc(e.id)}">${PICK.has(e.id)?I.check:''}</button>` : ''}</div>`).join('') + `</div>`).join('');
}

/* --- History --- */
function renderHist(m){
  header('Historique');
  const now = new Date();
  if (!V.month) V.month = { y:now.getFullYear(), m:now.getMonth() };
  const { y, m:mo } = V.month;
  const first = new Date(y, mo, 1), days = new Date(y, mo+1, 0).getDate();
  const offset = (first.getDay() + 6) % 7;
  const byDay = {}; S.logs.forEach(l => { (byDay[dayKey(l.start)] = byDay[dayKey(l.start)] || []).push(l); });
  const monthLogs = S.logs.filter(l => { const d = new Date(l.start); return d.getFullYear()===y && d.getMonth()===mo; });
  let cells = ['L','M','M','J','V','S','D'].map(h => `<div class="h">${h}</div>`).join('');
  for (let i=0;i<offset;i++) cells += `<div class="d out"></div>`;
  for (let d=1; d<=days; d++){
    const k = `${y}-${mo+1}-${d}`, has = byDay[k];
    const isToday = now.getFullYear()===y && now.getMonth()===mo && now.getDate()===d;
    cells += `<button class="d ${has?'has':''} ${isToday?'today':''} ${V.selDay===k?'sel':''}" data-a="${has?'selday':''}" data-v="${k}">${d}${has && has.length>1?`<span class="n">×${has.length}</span>`:''}</button>`;
  }
  const shown = V.selDay ? (byDay[V.selDay] || []) : monthLogs;
  const label = first.toLocaleDateString('fr-FR', { month:'long', year:'numeric' });
  m.innerHTML = `<div class="card"><div class="row" style="margin-bottom:8px"><button class="iconbtn" style="box-shadow:none;background:var(--soft)" data-a="month" data-v="-1">${I.back}</button>
    <div class="grow" style="text-align:center;font-weight:700;text-transform:capitalize">${label}</div>
    <button class="iconbtn" style="box-shadow:none;background:var(--soft);transform:scaleX(-1)" data-a="month" data-v="1">${I.back}</button></div>
    <div class="cal">${cells}</div>
    <div class="small muted" style="text-align:center;margin-top:10px">${monthLogs.length} séance${monthLogs.length>1?'s':''} ce mois-ci</div></div>
    <div class="section-title">${V.selDay ? 'Ce jour-là' : 'Séances du mois'}${V.selDay?` <button class="pill" data-a="selday" data-v="">tout le mois</button>`:''}</div>` +
    (shown.length ? shown.map(logCard).join('') : `<div class="card muted small">Aucune séance enregistrée${V.selDay?' ce jour':' ce mois-ci'}.</div>`);
}
function logCard(l){
  const open = V.openLog === l.id;
  const nSets = l.items.reduce((a,i) => a + i.sets.filter(s => s.done).length, 0);
  return `<div class="card"><button class="row" style="width:100%;text-align:left" data-a="openlog" data-v="${l.id}">
    <div class="grow"><div style="font-weight:700">${esc(l.dayName || 'Séance')} <span class="muted small" style="font-weight:500">· ${esc(l.programName||'')}</span></div>
    <div class="small muted">${cap(dLong(l.start))} · ${dur((l.end||l.start)-l.start)} · ${nSets} séries</div></div><span class="muted">${open?I.up:I.down}</span></button>
    ${open ? `<div style="margin-top:8px">${l.items.filter(i => i.sets.some(s => s.done)).map(i => `<div class="hist-ex"><b>${esc(exById(i.exId).n)}</b><div class="muted">${esc(perfStr(i.sets.filter(s => s.done)))}</div></div>`).join('') || '<div class="muted small">Aucune série validée.</div>'}
      <div class="sp"></div><button class="btn sm danger" data-a="dellog" data-v="${l.id}">Supprimer cette séance</button></div>` : ''}</div>`;
}

/* ---------- rest timer ---------- */
let T = null, tInt = null, actx = null;
function beep(){
  try{ if (!actx) return; const o = actx.createOscillator(), g = actx.createGain(); o.connect(g); g.connect(actx.destination);
    o.frequency.value = 880; g.gain.setValueAtTime(.0001, actx.currentTime); g.gain.exponentialRampToValueAtTime(.4, actx.currentTime+.02);
    g.gain.exponentialRampToValueAtTime(.0001, actx.currentTime+.5); o.start(); o.stop(actx.currentTime+.55);
    setTimeout(() => { try{ const o2 = actx.createOscillator(); o2.connect(g); o2.frequency.value = 1175; g.gain.setValueAtTime(.4, actx.currentTime); g.gain.exponentialRampToValueAtTime(.0001, actx.currentTime+.6); o2.start(); o2.stop(actx.currentTime+.65);}catch(e){} }, 300);
  }catch(e){}
}
function unlockAudio(){ try{ if (!actx){ const C = window.AudioContext || window.webkitAudioContext; if (C) actx = new C(); } if (actx && actx.state === 'suspended') actx.resume(); }catch(e){} }
function startTimer(sec){ T = { end:Date.now()+sec*1000, total:sec, fin:false }; clearInterval(tInt); tInt = setInterval(drawTimer, 250); drawTimer(); }
function stopTimer(){ T = null; clearInterval(tInt); $('#timer').innerHTML = ''; }
function drawTimer(){
  if (!T) return;
  const left = Math.max(0, Math.ceil((T.end - Date.now())/1000));
  if (left === 0 && !T.fin){ T.fin = true; beep(); setTimeout(() => { if (T && T.fin) stopTimer(); }, 4000); }
  const mm = Math.floor(left/60), ss = String(left%60).padStart(2,'0');
  const pct = Math.min(100, 100 * (1 - (T.end - Date.now())/(T.total*1000)));
  $('#timer').innerHTML = `<div class="timer ${T.fin?'fin':''}"><span class="t">${T.fin ? 'Go !' : `${mm}:${ss}`}</span><span class="grow small">${T.fin ? 'Repos terminé' : 'Repos'}</span>
    ${T.fin ? '' : `<button data-a="tadd" data-v="-15">−15</button><button data-a="tadd" data-v="15">+15</button>`}<button data-a="tstop">${T.fin?'OK':'Passer'}</button><span class="bar" style="width:${pct}%"></span></div>`;
}

/* ---------- actions ---------- */
// Defaults applied to exercises newly added to a program (Settings → "Valeurs par défaut")
function defaults(){ const s = S.settings; return { sets: parseInt(s.defSets) || 3, reps: String(s.defReps || '').trim() || '8-12', rest: RESTS.includes(+s.defRest) ? +s.defRest : 90 }; }
function prog(){ return S.programs.find(x => x.id === V.edit); }
const keepScroll = fn => { const y = window.scrollY; fn(); window.scrollTo(0, y); };

const A = {
  tab(el){ V.tab = el.dataset.v; V.edit = null; window.scrollTo(0,0); render(); },
  settings(){ settingsSheet(); },
  closesheet(){ closeSheet(); },
  theme(el){ S.settings.theme = el.dataset.v; applyTheme(); persist('state'); settingsSheet(); },
  newprog(){
    const p = { id:uid(), name:'Mon programme', created:Date.now(), days:[{ id:uid(), name:'Séance A', items:[] }] };
    S.programs.push(p); if (!S.activeId) S.activeId = p.id;
    persist('state'); V.tab = 'prog'; V.edit = p.id; window.scrollTo(0,0); render();
  },
  edit(el){ V.tab = 'prog'; V.edit = el.dataset.p; window.scrollTo(0,0); render(); },
  closeedit(){ V.edit = null; render(); },
  archive(){ confirmSheet('Archiver le programme ?', 'Il restera disponible dans l\'archive et tu pourras le réactiver à tout moment.', 'Archiver', 'doarchive', false); },
  doarchive(){ S.activeId = null; persist('state'); closeSheet(); render(); },
  activate(el){ S.activeId = el.dataset.p; persist('state'); toast('Programme activé'); V.edit = null; render(); },
  delprog(el){ A._del = el.dataset.p; confirmSheet('Supprimer ce programme ?', "Le programme sera effacé. L'historique de tes séances est conservé.", 'Supprimer', 'dodelprog'); },
  dodelprog(){ S.programs = S.programs.filter(p => p.id !== A._del); if (S.activeId === A._del) S.activeId = null; persist('state'); closeSheet(); render(); },
  addday(){ const p = prog(); p.days.push({ id:uid(), name:'Séance ' + String.fromCharCode(65 + p.days.length), items:[] }); persist('state'); keepScroll(render); },
  daydel(el){ A._dd = +el.dataset.di; confirmSheet('Supprimer cette séance ?', 'Les exercices de cette séance seront retirés du programme.', 'Supprimer', 'dodaydel'); },
  dodaydel(){ prog().days.splice(A._dd, 1); persist('state'); closeSheet(); keepScroll(render); },
  itdel(el){ prog().days[+el.dataset.di].items.splice(+el.dataset.ii, 1); persist('state'); keepScroll(render); },
  pick(el){ openPicker(+el.dataset.di); },
  toggpick(el){
    const id = el.dataset.e; PICK.has(id) ? PICK.delete(id) : PICK.add(id);
    document.querySelectorAll(`.pick[data-e="${CSS.escape(id)}"]`).forEach(b => { b.classList.toggle('on', PICK.has(id)); b.innerHTML = PICK.has(id) ? I.check : ''; });
    $('#pickbtn').textContent = `Ajouter (${PICK.size})`;
  },
  pickdone(){
    const d = prog().days[pickDay];
    const df = defaults(); PICK.forEach(id => d.items.push({ id:uid(), exId:id, sets:df.sets, reps:df.reps, rest:df.rest }));
    persist('state'); closeSheet(); keepScroll(render);
    if (PICK.size) toast(`${PICK.size} exercice${PICK.size>1?'s':''} ajouté${PICK.size>1?'s':''}`);
  },
  jump(el){
    const inSheet = el.closest('.sheet');
    const t = document.getElementById('mu-' + (inSheet ? 'p-' : '') + el.dataset.v);
    if (!t) return;
    if (inSheet){ const sh = inSheet; sh.scrollTo({ top: t.offsetTop - 110, behavior:'smooth' }); }
    else window.scrollTo({ top: t.getBoundingClientRect().top + window.scrollY - 115, behavior:'smooth' });
  },
  ex(el){ showEx(el.dataset.e); },
  newex(){ exForm(null); },
  editex(el){ exForm(S.custom.find(x => x.id === el.dataset.e)); },
  saveex(){
    const d = exDraft; d.n = $('#xf-n').value.trim(); d.m = $('#xf-m').value; d.e = $('#xf-e').value; d.c = $('#xf-c').value.trim();
    if (!d.n){ toast('Donne un nom à l\'exercice'); return; }
    const i = S.custom.findIndex(x => x.id === d.id); if (i >= 0) S.custom[i] = d; else S.custom.push(d);
    persist('ex_' + d.id); closeSheet(); render(); toast('Exercice enregistré');
  },
  delex(el){ A._dx = el.dataset.e; confirmSheet('Supprimer cet exercice ?', 'Il sera retiré de la bibliothèque. Il restera affiché comme « supprimé » dans les programmes qui l\'utilisent.', 'Supprimer', 'dodelex'); },
  dodelex(){ S.custom = S.custom.filter(x => x.id !== A._dx); persist('ex_' + A._dx); closeSheet(); render(); },
  start(el){
    unlockAudio();
    if (S.current){ toast('Une séance est déjà en cours'); return; }
    startWorkout(el.dataset.d);
  },
  toggle(el){
    unlockAudio();
    const it = S.current.items[+el.dataset.i], s = it.sets[+el.dataset.j];
    s.done = !s.done; persist('current');
    if (s.done){
      it.sets.forEach((x, k) => { if (k > +el.dataset.j && !x.done && (x.w === null || x.w === undefined)) x.w = s.w; });
      const left = S.current.items.some(x => x.sets.some(y => !y.done));
      if (left) startTimer(it.target.rest || 90); else stopTimer();
    }
    keepScroll(render);
  },
  addset(el){ const it = S.current.items[+el.dataset.i]; const l = it.sets[it.sets.length-1]; it.sets.push({ w:l?l.w:null, r:l?l.r:firstReps(it.target.reps), done:false }); persist('current'); keepScroll(render); },
  delset(el){ const it = S.current.items[+el.dataset.i]; if (it.sets.length > 1){ it.sets.pop(); persist('current'); keepScroll(render); } },
  finish(){
    const n = S.current.items.reduce((a,i) => a + i.sets.filter(s => s.done).length, 0);
    const tot = S.current.items.reduce((a,i) => a + i.sets.length, 0);
    if (!n){ confirmSheet('Aucune série validée', 'Coche au moins une série (✓) pour enregistrer la séance, ou abandonne-la.', 'Abandonner la séance', 'doabandon'); return; }
    confirmSheet('Terminer la séance ?', `${n} série${n>1?'s':''} validée${n>1?'s':''} sur ${tot}. Seules les séries cochées seront enregistrées.`, 'Enregistrer la séance', 'dofinish', false);
  },
  dofinish(){
    const w = S.current; w.end = Date.now();
    S.logs.unshift(w); sortLogs(); S.current = null; stopTimer();
    persist('log_' + w.id, 'current'); closeSheet(); window.scrollTo(0,0); render(); toast('Séance enregistrée 💪');
  },
  abandon(){ confirmSheet('Abandonner la séance ?', 'Les séries saisies ne seront pas enregistrées.', 'Abandonner', 'doabandon'); },
  doabandon(){ S.current = null; stopTimer(); persist('current'); closeSheet(); window.scrollTo(0,0); render(); },
  tadd(el){ if (T){ T.end += (+el.dataset.v)*1000; T.total = Math.max(T.total + (+el.dataset.v), 1); drawTimer(); } },
  tstop(){ stopTimer(); },
  month(el){ const d = new Date(V.month.y, V.month.m + (+el.dataset.v), 1); V.month = { y:d.getFullYear(), m:d.getMonth() }; V.selDay = null; render(); },
  selday(el){ V.selDay = el.dataset.v && V.selDay !== el.dataset.v ? el.dataset.v : null; keepScroll(render); },
  openlog(el){ V.openLog = V.openLog === el.dataset.v ? null : el.dataset.v; keepScroll(render); },
  dellog(el){ A._dl = el.dataset.v; confirmSheet('Supprimer cette séance ?', 'Elle sera retirée de ton historique.', 'Supprimer', 'dodellog'); },
  dodellog(){ S.logs = S.logs.filter(l => l.id !== A._dl); persist('log_' + A._dl); closeSheet(); keepScroll(render); },
  async export(){
    const data = JSON.stringify({ app:'workout', version:1, exported:new Date().toISOString(), programs:S.programs, activeId:S.activeId, settings:S.settings, custom:S.custom, logs:S.logs }, null, 1);
    const name = `workout-sauvegarde-${new Date().toISOString().slice(0,10)}.json`;
    try{
      const dl = window.claude && claude.use ? await claude.use('downloads') : null;
      if (dl){ await dl.save({ filename:name, data }); toast('Sauvegarde exportée'); return; }
    }catch(e){ if (e && e.code && e.code !== 'not_granted' && e.code !== 'capability_disabled'){ return; } }
    try{ await navigator.clipboard.writeText(data); toast('Sauvegarde copiée dans le presse-papiers'); }
    catch(e){ openSheet('Sauvegarde', `<p class="small muted">Copie ce texte et garde-le dans tes Notes :</p><textarea rows="10" readonly>${esc(data)}</textarea>`); }
  },
  doimport(){
    const j = A._imp; const before = allKeys();
    S.programs = j.programs || []; S.activeId = j.activeId || null; S.settings = Object.assign({theme:'auto'}, j.settings || {});
    S.custom = j.custom || []; S.logs = j.logs || []; sortLogs();
    persist([...new Set([...before, ...allKeys()])]); applyTheme(); closeSheet(); V.edit = null; render(); toast('Sauvegarde importée');
  },
};

document.addEventListener('click', e => {
  const el = e.target.closest('[data-a]'); if (!el) return;
  const a = el.dataset.a; if (!a || !A[a]) return;
  e.preventDefault(); A[a](el);
});
let inputT = null;
document.addEventListener('input', e => {
  const el = e.target, ds = el.dataset;
  if (ds.f && S.current){
    const s = S.current.items[+ds.i].sets[+ds.j];
    if (ds.f === 'w') s.w = el.value.trim() === '' ? null : num(el.value);
    else s.r = el.value.trim() === '' ? null : parseInt(el.value) || null;
    clearTimeout(inputT); inputT = setTimeout(() => persist('current'), 600);
  } else if (ds.pf){ prog().name = el.value; clearTimeout(inputT); inputT = setTimeout(() => persist('state'), 600); }
  else if (ds.df){ prog().days[+ds.di].name = el.value; clearTimeout(inputT); inputT = setTimeout(() => persist('state'), 600); }
  else if (ds.sf){
    S.settings[ds.sf] = ds.sf === 'defReps' ? el.value : ds.sf === 'defRest' ? +el.value : (parseInt(el.value) || '');
    clearTimeout(inputT); inputT = setTimeout(() => persist('state'), 600);
  }
  else if (ds.if){
    const it = prog().days[+ds.di].items[+ds.ii];
    it[ds.if] = ds.if === 'sets' ? (parseInt(el.value) || '') : ds.if === 'rest' ? +el.value : el.value;
    clearTimeout(inputT); inputT = setTimeout(() => persist('state'), 600);
  }
});
document.addEventListener('change', e => {
  const el = e.target;
  if (el.id === 'xf-file' && el.files[0]){
    const f = el.files[0], img = new Image(), url = URL.createObjectURL(f);
    img.onload = () => {
      const k = Math.min(1, 480 / Math.max(img.width, img.height)), c = document.createElement('canvas');
      c.width = Math.round(img.width*k); c.height = Math.round(img.height*k);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      exDraft.photo = c.toDataURL('image/jpeg', .72); URL.revokeObjectURL(url);
      const p = $('#xf-prev'); p.outerHTML = `<img class="thumb" id="xf-prev" src="${exDraft.photo}">`;
    };
    img.src = url;
  }
  if (el.id === 'importfile' && el.files[0]){
    el.files[0].text().then(t => {
      try{ const j = JSON.parse(t); if (j.app !== 'workout' && j.app !== 'muscu') throw 0; A._imp = j;
        confirmSheet('Importer cette sauvegarde ?', `Elle contient ${(j.programs||[]).length} programme(s) et ${(j.logs||[]).length} séance(s). Elle remplacera toutes les données actuelles.`, 'Remplacer mes données', 'doimport');
      }catch(err){ toast("Ce fichier n'est pas une sauvegarde valide"); }
    });
  }
});
window.addEventListener('beforeunload', () => { lsSave(); });

/* ---------- drag & drop reordering in the program editor ----------
   Press the grip handle and drag: exercises can move within a session or to another
   session; whole sessions can be reordered. The DOM is reordered live, and the new
   order is read back from the DOM into the program on release. */
let D = null;
document.addEventListener('pointerdown', e => {
  const g = e.target.closest('[data-drag]'); if (!g || D) return;
  const kind = g.dataset.drag, el = g.closest(kind === 'day' ? '.dayc' : '.item-ed'); if (!el) return;
  e.preventDefault();
  try{ g.setPointerCapture(e.pointerId); }catch(err){}
  if (document.activeElement && document.activeElement.blur) document.activeElement.blur();
  D = { kind, el, g, pid:e.pointerId, y:e.clientY, grab:e.clientY - el.getBoundingClientRect().top, raf:0 };
  el.classList.add('dragging'); document.body.classList.add('dnd');
  if (navigator.vibrate) try{ navigator.vibrate(10); }catch(err){}
  const loop = () => { if (!D) return; const h = window.innerHeight, edge = 80;
    const v = D.y < edge ? -(edge - D.y) / 4 : D.y > h - edge - 60 ? (D.y - (h - edge - 60)) / 4 : 0;
    if (v){ window.scrollBy(0, v); dragMove(); } D.raf = requestAnimationFrame(loop); };
  D.raf = requestAnimationFrame(loop);
});
function dragMove(){
  const { el, kind, y } = D;
  el.style.transform = '';
  if (kind === 'day'){
    const list = [...document.querySelectorAll('.dayc')].filter(x => x !== el);
    const after = list.find(x => { const r = x.getBoundingClientRect(); return y < r.top + r.height / 2; });
    const par = el.parentNode;
    if (after){ if (el.nextElementSibling !== after) par.insertBefore(el, after); }
    else { const last = list[list.length - 1]; if (last && last.nextElementSibling !== el) last.after(el); }
  } else {
    const boxes = [...document.querySelectorAll('.items')];
    // pick the session whose card is under the finger (or the nearest one)
    let box = boxes.find(b => { const r = b.closest('.dayc').getBoundingClientRect(); return y >= r.top && y <= r.bottom; });
    if (!box) box = y < boxes[0].closest('.dayc').getBoundingClientRect().top ? boxes[0] : boxes[boxes.length - 1];
    const list = [...box.querySelectorAll('.item-ed')].filter(x => x !== el);
    const after = list.find(x => { const r = x.getBoundingClientRect(); return y < r.top + r.height / 2; });
    if (after){ if (el.nextElementSibling !== after || el.parentNode !== box) box.insertBefore(el, after); }
    else if (el.parentNode !== box || el.nextElementSibling) box.appendChild(el);
  }
  // keep the dragged block under the finger
  el.style.transform = `translateY(${y - D.grab - el.getBoundingClientRect().top}px)`;
}
document.addEventListener('pointermove', e => { if (!D || e.pointerId !== D.pid) return; e.preventDefault(); D.y = e.clientY; dragMove(); }, { passive:false });
function dragEnd(e){
  if (!D || (e && e.pointerId !== D.pid)) return;
  cancelAnimationFrame(D.raf);
  const { kind } = D; D.el.classList.remove('dragging'); D.el.style.transform = ''; document.body.classList.remove('dnd'); D = null;
  const p = prog(); if (!p) return;
  if (kind === 'day'){
    const ids = [...document.querySelectorAll('.dayc')].map(x => x.dataset.did);
    p.days.sort((a, b) => ids.indexOf(a.id) - ids.indexOf(b.id));
  } else {
    const all = {}; p.days.forEach(d => d.items.forEach(it => all[it.id] = it));
    document.querySelectorAll('.items').forEach(b => {
      const d = p.days[+b.dataset.di]; if (d) d.items = [...b.querySelectorAll('.item-ed')].map(x => all[x.dataset.iid]).filter(Boolean);
    });
  }
  persist('state'); keepScroll(render);
}
document.addEventListener('pointerup', dragEnd);
document.addEventListener('pointercancel', dragEnd);
// iOS: stop the page from scrolling while a drag is in progress
document.addEventListener('touchmove', e => { if (D) e.preventDefault(); }, { passive:false });

/* ---------- boot ---------- */
lsLoad(); sortLogs(); applyTheme(); render();
setTimeout(initRemote, 0);
if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => {});
try{ navigator.storage && navigator.storage.persist && navigator.storage.persist(); }catch(e){}
</script>
