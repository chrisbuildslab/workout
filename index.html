<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Workout">
<title>Workout</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<meta name="theme-color" content="#e2552b">
<style>
:root{
  --bg:#f4f4f1;--card:#ffffff;--ink:#17181a;--muted:#6b6e74;--line:#e3e3de;--soft:#ecece7;
  --accent:#e2552b;--accent-ink:#fff;--ok:#2f9e5b;--okbg:#e4f4ea;--danger:#c93a3a;
  --shadow:0 1px 2px rgba(0,0,0,.05),0 2px 10px rgba(0,0,0,.04);
}
html[data-theme=dark]{
  --bg:#0f1012;--card:#1a1b1e;--ink:#f1f1ee;--muted:#9a9ca3;--line:#2b2d31;--soft:#24262a;
  --accent:#ff6a3d;--accent-ink:#111;--ok:#4cc27c;--okbg:#17301f;--danger:#ff6b6b;--shadow:none;
}
@media (prefers-color-scheme:dark){
  html:not([data-theme=light]){
    --bg:#0f1012;--card:#1a1b1e;--ink:#f1f1ee;--muted:#9a9ca3;--line:#2b2d31;--soft:#24262a;
    --accent:#ff6a3d;--accent-ink:#111;--ok:#4cc27c;--okbg:#17301f;--danger:#ff6b6b;--shadow:none;
  }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink)}
body{font:16px/1.4 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif;padding-bottom:calc(76px + env(safe-area-inset-bottom))}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
input,select,textarea{font:inherit;color:var(--ink);background:var(--soft);border:1px solid transparent;border-radius:10px;padding:9px 10px;width:100%;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--accent)}
h1,h2,h3{margin:0;line-height:1.2}
.top{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);display:flex;align-items:center;gap:8px;padding:12px 16px 10px}
.top h1{font-size:26px;font-weight:800;letter-spacing:-.02em;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.iconbtn{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:var(--card);box-shadow:var(--shadow);flex:none}
.iconbtn svg{width:20px;height:20px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--muted);flex:none}
.dot.ok{background:var(--ok)}.dot.off{background:#d9a227}
main{padding:4px 16px 24px;max-width:640px;margin:0 auto}
.card{background:var(--card);border-radius:16px;padding:14px;box-shadow:var(--shadow);margin-bottom:12px}
.muted{color:var(--muted)}.small{font-size:13px}.tiny{font-size:12px}
.row{display:flex;align-items:center;gap:10px}
.grow{flex:1;min-width:0}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border-radius:12px;padding:11px 16px;font-weight:650;background:var(--soft)}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
.btn.danger{color:var(--danger)}
.btn.block{display:flex;width:100%}
.btn.sm{padding:7px 11px;font-size:14px;border-radius:10px}
.section-title{font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:18px 2px 8px}
.empty{text-align:center;padding:36px 12px}
.empty h2{font-size:20px;margin-bottom:6px}
.thumb{width:52px;height:52px;border-radius:10px;object-fit:cover;background:#fff;flex:none}
.thumb.ph{display:grid;place-items:center;background:var(--soft);color:var(--muted);font-weight:800;font-size:18px}
.list-item{display:flex;align-items:center;gap:12px;padding:8px 0;border-bottom:1px solid var(--line);width:100%;text-align:left}
.list-item:last-child{border-bottom:0}
.pill{display:inline-block;font-size:12px;font-weight:650;padding:3px 8px;border-radius:99px;background:var(--soft);color:var(--muted)}
.pill.acc{background:color-mix(in srgb,var(--accent) 16%,transparent);color:var(--accent)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 10px;scrollbar-width:none;position:sticky;top:60px;z-index:5;background:var(--bg)}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:7px 12px;border-radius:99px;background:var(--card);box-shadow:var(--shadow);font-size:14px;font-weight:600}
.daycard h3{font-size:18px}
.daycard .ex{font-size:14px;color:var(--muted);margin-top:4px}
/* tabs */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;background:color-mix(in srgb,var(--card) 92%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 0 7px;font-size:11px;font-weight:600;color:var(--muted)}
.tab svg{width:24px;height:24px}
.tab.on{color:var(--accent)}
/* workout */
.wk-head{display:flex;justify-content:space-between;align-items:baseline;margin:2px 2px 12px}
.sets{width:100%;border-collapse:collapse;margin-top:10px}
.sets th{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:700;text-align:center;padding:0 4px 4px}
.sets td{padding:3px 4px;text-align:center}
.sets td:first-child{width:28px;font-weight:700;color:var(--muted)}
.sets input{text-align:center;padding:8px 4px;font-weight:650}
.sets tr.done input{background:var(--okbg)}
.check{width:40px;height:38px;border-radius:10px;background:var(--soft);display:grid;place-items:center;color:var(--muted)}
.check svg{width:20px;height:20px}
.done .check{background:var(--ok);color:#fff}
.last{font-size:13px;color:var(--muted);margin-top:2px}
.last b{color:var(--ink);font-weight:600}
/* timer */
.timer{position:fixed;left:12px;right:12px;bottom:calc(66px + env(safe-area-inset-bottom));z-index:40;background:var(--ink);color:var(--bg);border-radius:16px;padding:10px 12px;display:flex;align-items:center;gap:10px;box-shadow:0 8px 30px rgba(0,0,0,.25);max-width:616px;margin:0 auto}
.timer .t{font-size:26px;font-weight:800;font-variant-numeric:tabular-nums;min-width:74px}
.timer .bar{position:absolute;left:0;bottom:0;height:3px;background:var(--accent);border-radius:0 0 0 16px}
.timer button{background:rgba(127,127,127,.25);border-radius:10px;padding:7px 10px;font-weight:700;font-size:14px;color:inherit}
.timer.fin{background:var(--ok);color:#fff}
/* sheet */
.backdrop{position:fixed;inset:0;background:rgba(0,0,0,.42);z-index:50;animation:fade .15s}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:51;background:var(--bg);border-radius:20px 20px 0 0;max-height:92vh;overflow:auto;padding:8px 16px calc(20px + env(safe-area-inset-bottom));animation:up .2s ease-out;max-width:640px;margin:0 auto}
.sheet .grab{width:40px;height:5px;border-radius:3px;background:var(--line);margin:2px auto 10px}
.sheet-head{display:flex;align-items:center;gap:10px;margin-bottom:12px;position:sticky;top:-8px;background:var(--bg);padding:6px 0;z-index:2}
.sheet-head h2{flex:1;font-size:20px}
@keyframes up{from{transform:translateY(40px);opacity:0}}
@keyframes fade{from{opacity:0}}
.anim{position:relative;border-radius:14px;overflow:hidden;background:#fff;aspect-ratio:3/2}
.anim img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;transition:opacity .25s}
.anim img.b{opacity:0}.anim.alt img.a{opacity:0}.anim.alt img.b{opacity:1}
.anim.spr{background-size:200% 100%;background-position:0 0;background-repeat:no-repeat}
.anim.spr.alt{background-position:100% 0}
.thumb.spr{background-size:auto 100%;background-position:12.5% 50%;background-repeat:no-repeat;background-color:#fff}
.anim .lbl{position:absolute;left:8px;bottom:8px;font-size:11px;font-weight:700;background:rgba(0,0,0,.55);color:#fff;padding:3px 7px;border-radius:6px}
details summary{cursor:pointer;color:var(--muted);font-size:14px;margin-top:12px}
ol{padding-left:20px;margin:8px 0}
label.f{display:block;font-size:13px;font-weight:650;color:var(--muted);margin:12px 0 5px}
.seg{display:flex;background:var(--soft);border-radius:11px;padding:3px}
.seg button{flex:1;padding:8px;border-radius:9px;font-weight:600;font-size:14px;color:var(--muted)}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:var(--shadow)}
.pick{width:26px;height:26px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;flex:none}
.pick.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.pick svg{width:15px;height:15px}
.stickybar{position:sticky;bottom:0;padding:10px 0 0;background:linear-gradient(transparent,var(--bg) 30%)}
.item-ed{border-bottom:1px solid var(--line);padding:10px 0}
.item-ed:last-child{border-bottom:0}
.mini{display:grid;grid-template-columns:1fr 1fr 1.3fr;gap:8px;margin-top:8px}
.mini label{font-size:11px;color:var(--muted);font-weight:650;display:block;margin-bottom:3px;text-transform:uppercase;letter-spacing:.04em}
.mini input,.mini select{padding:7px 8px;font-size:15px}
.ord{display:flex;gap:2px}
.ord button{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;color:var(--muted)}
.ord button svg{width:18px;height:18px}
.grip{width:30px;height:38px;display:grid;place-items:center;color:var(--muted);touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;cursor:grab;flex:none}
.grip svg{width:20px;height:20px}
.dragging{position:relative;z-index:20;background:var(--card);box-shadow:0 10px 30px rgba(0,0,0,.25);border-radius:12px;opacity:.97;transition:none!important}
body.dnd{-webkit-user-select:none;user-select:none}
.defs{display:grid;grid-template-columns:1fr 1fr 1.3fr;gap:8px}
/* calendar */
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}
.cal .h{font-size:11px;font-weight:700;color:var(--muted);padding:4px 0}
.cal .d{aspect-ratio:1;border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:15px;font-weight:600;position:relative}
.cal .d.out{visibility:hidden}
.cal .d.today{outline:2px solid var(--line)}
.cal .d.has{background:var(--accent);color:var(--accent-ink)}
.cal .d.sel{outline:2px solid var(--ink)}
.cal .d .n{font-size:9px;opacity:.85}
.toast{position:fixed;left:50%;top:72px;transform:translateX(-50%);z-index:80;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;font-weight:600;max-width:90vw;animation:fade .2s}
.sp{height:8px}
.hist-ex{padding:6px 0;border-bottom:1px solid var(--line);font-size:14px}
.hist-ex:last-child{border:0}
</style>
</head>
<body>
<header class="top" id="top"></header>
<main id="main"></main>

<div id="sheet"></div>

<script id="exdata" type="application/json">[{"id":"Barbell_Bench_Press_-_Medium_Grip","n":"Développé couché barre","c":"Omoplates serrées, descends la barre au bas des pecs, pousse en expirant.","m":"Pectoraux","m2":["Triceps","Épaules"],"e":"Barre","en":"Barbell Bench Press - Medium Grip","steps":["Lie back on a flat bench. Using a medium width grip (a grip that creates a 90-degree angle in the middle of the movement between the forearms and the upper arms), lift the bar from the rack and hold it straight over you with your arms locked. This will be your starting position.","From the starting position, breathe in and begin coming down slowly until the bar touches your middle chest.","After a brief pause, push the bar back to the starting position as you breathe out. Focus on pushing the bar using your chest muscles. Lock your arms and squeeze your chest in the contracted position at the top of the motion, hold for a second and then start coming down slowly again. Tip: Ideally, lowering the weight should take about twice as long as raising it.","Repeat the movement for the prescribed amount of repetitions.","When you are done, place the bar back in the rack."],"s":"sp/Barbell_Bench_Press___Medium_Grip.jpg"},{"id":"Barbell_Incline_Bench_Press_-_Medium_Grip","n":"Développé incliné barre","c":"Banc à 30-45°, barre vers le haut des pecs, coudes à ~45°.","m":"Pectoraux","m2":["Triceps","Épaules"],"e":"Barre","en":"Barbell Incline Bench Press - Medium Grip","steps":["Lie back on an incline bench. Using a medium-width grip (a grip that creates a 90-degree angle in the middle of the movement between the forearms and the upper arms), lift the bar from the rack and hold it straight over you with your arms locked. This will be your starting position.","As you breathe in, come down slowly until you feel the bar on you upper chest.","After a second pause, bring the bar back to the starting position as you breathe out and push the bar using your chest muscles. Lock your arms in the contracted position, squeeze your chest, hold for a second and then start coming down slowly again. Tip: it should take at least twice as long to go down than to come up.","Repeat the movement for the prescribed amount of repetitions.","When you are done, place the bar back in the rack."],"s":"sp/Barbell_Incline_Bench_Press___Medium_Grip.jpg"},{"id":"Decline_Barbell_Bench_Press","n":"Développé décliné barre","c":"Banc décliné, barre vers le bas des pecs, contrôle la descente.","m":"Pectoraux","m2":["Triceps","Épaules"],"e":"Barre","en":"Decline Barbell Bench Press","steps":["Secure your legs at the end of the decline bench and slowly lay down on the bench.","Using a medium width grip (a grip that creates a 90-degree angle in the middle of the movement between the forearms and the upper arms), lift the bar from the rack and hold it straight over you with your arms locked. The arms should be perpendicular to the floor. This will be your starting position. Tip: In order to protect your rotator cuff, it is best if you have a spotter help you lift the barbell off the rack.","As you breathe in, come down slowly until you feel the bar on your lower chest.","After a second pause, bring the bar back to the starting position as you breathe out and push the bar using your chest muscles. Lock your arms and squeeze your chest in the contracted position, hold for a second and then start coming down slowly again. Tip: It should take at least twice as long to go down than to come up).","Repeat the movement for the prescribed amount of repetitions.","When you are done, place the bar back in the rack."],"s":"sp/Decline_Barbell_Bench_Press.jpg"},{"id":"Dumbbell_Bench_Press","n":"Développé couché haltères","c":"Haltères au niveau de la poitrine, pousse en rapprochant légèrement en haut.","m":"Pectoraux","m2":["Triceps","Épaules"],"e":"Haltères","en":"Dumbbell Bench Press","steps":["Lie down on a flat bench with a dumbbell in each hand resting on top of your thighs. The palms of your hands will be facing each other.","Then, using your thighs to help raise the dumbbells up, lift the dumbbells one at a time so that you can hold them in front of you at shoulder width.","Once at shoulder width, rotate your wrists forward so that the palms of your hands are facing away from you. The dumbbells should be just to the sides of your chest, with your upper arm and forearm creating a 90 degree angle. Be sure to maintain full control of the dumbbells at all times. This will be your starting position.","Then, as you breathe out, use your chest to push the dumbbells up. Lock your arms at the top of the lift and squeeze your chest, hold for a second and then begin coming down slowly. Tip: Ideally, lowering the weight should take about twice as long as raising it.","Repeat the movement for the prescribed amount of repetitions of your training program."],"s":"sp/Dumbbell_Bench_Press.jpg"},{"id":"Incline_Dumbbell_Press","n":"Développé incliné haltères","c":"Banc à 30-45°, descends les haltères sur les côtés du haut des pecs.","m":"Pectoraux","m2":["Triceps","Épaules"],"e":"Haltères","en":"Incline Dumbbell Press","steps":["Lie back on an incline bench with a dumbbell in each hand atop your thighs. The palms of your hands will be facing each other.","Then, using your thighs to help push the dumbbells up, lift the dumbbells one at a time so that you can hold them at shoulder width.","Once you have the dumbbells raised to shoulder width, rotate your wrists forward so that the palms of your hands are facing away from you. This will be your starting position.","Be sure to keep full control of the dumbbells at all times. Then breathe out and push the dumbbells up with your chest.","Lock your arms at the top, hold for a second, and then start slowly lowering the weight. Tip Ideally, lowering the weights should take about twice as long as raising them.","Repeat the movement for the prescribed amount of repetitions.","When you are done, place the dumbbells back on your thighs and then on the floor. This is the safest manner to release the dumbbells."],"s":"sp/Incline_Dumbbell_Press.jpg"},{"id":"Decline_Dumbbell_Bench_Press","n":"Développé décliné haltères","c":"Banc décliné, poussée verticale contrôlée.","m":"Pectoraux","m2":["Triceps","Épaules"],"e":"Haltères","en":"Decline Dumbbell Bench Press","steps":["Secure your legs at the end of the decline bench and lie down with a dumbbell on each hand on top of your thighs. The palms of your hand will be facing each other.","Once you are laying down, move the dumbbells in front of you at shoulder width.","Once at shoulder width, rotate your wrists forward so that the palms of your hands are facing away from you. This will be your starting position.","Bring down the weights slowly to your side as you breathe out. Keep full control of the dumbbells at all times. Tip: Throughout the motion, the forearms should always be perpendicular to the floor.","As you breathe out, push the dumbbells up using your pectoral muscles. Lock your arms in the contracted position, squeeze your chest, hold for a second and then start coming down slowly. Tip: It should take at least twice as long to go down than to come up..","Repeat the movement for the prescribed amount of repetitions of your training program."],"s":"sp/Decline_Dumbbell_Bench_Press.jpg"},{"id":"Dumbbell_Flyes","n":"Écarté couché haltères","c":"Bras légèrement fléchis, ouvre en arc jusqu'à l'étirement, referme.","m":"Pectoraux","m2":[],"e":"Haltères","en":"Dumbbell Flyes","steps":["Lie down on a flat bench with a dumbbell on each hand resting on top of your thighs. The palms of your hand will be facing each other.","Then using your thighs to help raise the dumbbells, lift the dumbbells one at a time so you can hold them in front of you at shoulder width with the palms of your hands facing each other. Raise the dumbbells up like you're pressing them, but stop and hold just before you lock out. This will be your starting position.","With a slight bend on your elbows in order to prevent stress at the biceps tendon, lower your arms out at both sides in a wide arc until you feel a stretch on your chest. Breathe in as you perform this portion of the movement. Tip: Keep in mind that throughout the movement, the arms should remain stationary; the movement should only occur at the shoulder joint.","Return your arms back to the starting position as you squeeze your chest muscles and breathe out. Tip: Make sure to use the same arc of motion used to lower the weights.","Hold for a second at the contracted position and repeat the movement for the prescribed amount of repetitions."],"s":"sp/Dumbbell_Flyes.jpg"},{"id":"Incline_Dumbbell_Flyes","n":"Écarté incliné haltères","c":"Comme l'écarté couché, sur banc incliné pour le haut des pecs.","m":"Pectoraux","m2":["Épaules"],"e":"Haltères","en":"Incline Dumbbell Flyes","steps":["Hold a dumbbell on each hand and lie on an incline bench that is set to an incline angle of no more than 30 degrees.","Extend your arms above you with a slight bend at the elbows.","Now rotate the wrists so that the palms of your hands are facing you. Tip: The pinky fingers should be next to each other. This will be your starting position.","As you breathe in, start to slowly lower the arms to the side while keeping the arms extended and while rotating the wrists until the palms of the hand are facing each other. Tip: At the end of the movement the arms will be by your side with the palms facing the ceiling.","As you exhale start to bring the dumbbells back up to the starting position by reversing the motion and rotating the hands so that the pinky fingers are next to each other again. Tip: Keep in mind that the movement will only happen at the shoulder joint and at the wrist. There is no motion that happens at the elbow joint.","Repeat for the recommended amount of repetitions."],"s":"sp/Incline_Dumbbell_Flyes.jpg"},{"id":"Cable_Crossover","n":"Écarté à la poulie vis-à-vis","c":"Poulies hautes, ramène les mains devant le bas de la poitrine.","m":"Pectoraux","m2":["Épaules"],"e":"Poulie","en":"Cable Crossover","steps":["To get yourself into the starting position, place the pulleys on a high position (above your head), select the resistance to be used and hold the pulleys in each hand.","Step forward in front of an imaginary straight line between both pulleys while pulling your arms together in front of you. Your torso should have a small forward bend from the waist. This will be your starting position.","With a slight bend on your elbows in order to prevent stress at the biceps tendon, extend your arms to the side (straight out at both sides) in a wide arc until you feel a stretch on your chest. Breathe in as you perform this portion of the movement. Tip: Keep in mind that throughout the movement, the arms and torso should remain stationary; the movement should only occur at the shoulder joint.","Return your arms back to the starting position as you breathe out. Make sure to use the same arc of motion used to lower the weights.","Hold for a second at the starting position and repeat the movement for the prescribed amount of repetitions."],"s":"sp/Cable_Crossover.jpg"},{"id":"Low_Cable_Crossover","n":"Écarté poulie basse","c":"Poulies basses, ramène les mains vers le haut devant le visage.","m":"Pectoraux","m2":["Épaules"],"e":"Poulie","en":"Low Cable Crossover","steps":["To move into the starting position, place the pulleys at the low position, select the resistance to be used and grasp a handle in each hand.","Step forward, gaining tension in the pulleys. Your palms should be facing forward, hands below the waist, and your arms straight. This will be your starting position.","With a slight bend in your arms, draw your hands upward and toward the midline of your body. Your hands should come together in front of your chest, palms facing up.","Return your arms back to the starting position after a brief pause."],"s":"sp/Low_Cable_Crossover.jpg"},{"id":"Butterfly","n":"Pec deck (butterfly)","c":"Dos plaqué, rapproche les bras devant toi, retour lent.","m":"Pectoraux","m2":[],"e":"Machine","en":"Butterfly","steps":["Sit on the machine with your back flat on the pad.","Take hold of the handles. Tip: Your upper arms should be positioned parallel to the floor; adjust the machine accordingly. This will be your starting position.","Push the handles together slowly as you squeeze your chest in the middle. Breathe out during this part of the motion and hold the contraction for a second.","Return back to the starting position slowly as you inhale until your chest muscles are fully stretched.","Repeat for the recommended amount of repetitions."],"s":"sp/Butterfly.jpg"},{"id":"Machine_Bench_Press","n":"Développé couché machine","c":"Poignées à hauteur de poitrine, pousse sans verrouiller les coudes.","m":"Pectoraux","m2":["Triceps","Épaules"],"e":"Machine","en":"Machine Bench Press","steps":["Sit down on the Chest Press Machine and select the weight.","Step on the lever provided by the machine since it will help you to bring the handles forward so that you can grab the handles and fully extend the arms.","Grab the handles with a palms-down grip and lift your elbows so that your upper arms are parallel to the floor to the sides of your torso. Tip: Your forearms will be pointing forward since you are grabbing the handles. Once you bring the handles forward and extend the arms you will be at the starting position.","Now bring the handles back towards you as you breathe in.","Push the handles away from you as you flex your pecs and you breathe out. Hold the contraction for a second before going back to the starting position.","Repeat for the recommended amount of reps.","When finished step on the lever again and slowly get the handles back to their original place."],"s":"sp/Machine_Bench_Press.jpg"},{"id":"Leverage_Incline_Chest_Press","n":"Développé incliné machine","c":"Pousse vers le haut et l'avant, omoplates en arrière.","m":"Pectoraux","m2":["Triceps","Épaules"],"e":"Machine","en":"Leverage Incline Chest Press","steps":["Load an appropriate weight onto the pins and adjust the seat for your height. The handles should be near the top of the pectorals at the beginning of the motion. Your chest and head should be up and your shoulder blades retracted. This will be your starting position.","Press the handles forward by extending through the elbow.","After a brief pause at the top, return the weight just above the start position, keeping tension on the muscles by not returning the weight to the stops until the set is complete."],"s":"sp/Leverage_Incline_Chest_Press.jpg"},{"id":"Smith_Machine_Bench_Press","n":"Développé couché Smith","c":"Barre guidée vers le milieu des pecs.","m":"Pectoraux","m2":["Triceps","Épaules"],"e":"Machine","en":"Smith Machine Bench Press","steps":["Place a flat bench underneath the smith machine. Now place the barbell at a height that you can reach when lying down and your arms are almost fully extended. Once the weight you need is selected, lie down on the flat bench. Using a pronated grip that is wider than shoulder width, unlock the bar from the rack and hold it straight over you with your arms locked. This will be your starting position.","As you breathe in, come down slowly until you feel the bar on your middle chest.","After a second pause, bring the bar back to the starting position as you breathe out and push the bar using your chest muscles. Lock your arms in the contracted position, hold for a second and then start coming down slowly again. Tip: It should take at least twice as long to go down than to come up.","Repeat the movement for the prescribed amount of repetitions.","When you are done, lock the bar back in the rack."],"s":"sp/Smith_Machine_Bench_Press.jpg"},{"id":"Pushups","n":"Pompes","c":"Corps gainé et aligné, poitrine près du sol, pousse.","m":"Pectoraux","m2":["Triceps","Épaules"],"e":"Poids du corps","en":"Pushups","steps":["Lie on the floor face down and place your hands about 36 inches apart while holding your torso up at arms length.","Next, lower yourself downward until your chest almost touches the floor as you inhale.","Now breathe out and press your upper body back up to the starting position while squeezing your chest.","After a brief pause at the top contracted position, you can begin to lower yourself downward again for as many repetitions as needed."],"s":"sp/Pushups.jpg"},{"id":"Push-Up_Wide","n":"Pompes mains larges","c":"Mains plus larges que les épaules, accent sur les pecs.","m":"Pectoraux","m2":["Abdos","Triceps","Épaules"],"e":"Poids du corps","en":"Push-Up Wide","steps":["With your hands wide apart, support your body on your toes and hands in a plank position. Your elbows should be extended and your body straight. Do not allow your hips to sag. This will be your starting position.","To begin, allow the elbows to flex, lowering your chest to the floor as you inhale.","Using your pectoral muscles, press your upper body back up to the starting position by extending the elbows. Exhale as you perform this step.","After pausing at the contracted position, repeat the movement for the prescribed amount of repetitions."],"s":"sp/Push_Up_Wide.jpg"},{"id":"Push-Ups_With_Feet_Elevated","n":"Pompes pieds surélevés","c":"Pieds sur un banc, accent sur le haut des pecs.","m":"Pectoraux","m2":["Triceps","Épaules"],"e":"Poids du corps","en":"Push-Ups With Feet Elevated","steps":["Lie on the floor face down and place your hands about 36 inches apart from each other holding your torso up at arms length.","Place your toes on top of a flat bench. This will allow your body to be elevated. Note: The higher the elevation of the flat bench, the higher the resistance of the exercise is.","Lower yourself until your chest almost touches the floor as you inhale.","Using your pectoral muscles, press your upper body back up to the starting position and squeeze your chest. Breathe out as you perform this step.","After a second pause at the contracted position, repeat the movement for the prescribed amount of repetitions."],"s":"sp/Push_Ups_With_Feet_Elevated.jpg"},{"id":"Incline_Push-Up","n":"Pompes inclinées (mains surélevées)","c":"Mains sur un banc : version plus facile des pompes.","m":"Pectoraux","m2":["Triceps","Épaules"],"e":"Poids du corps","en":"Incline Push-Up","steps":["Stand facing bench or sturdy elevated platform. Place hands on edge of bench or platform, slightly wider than shoulder width.","Position forefoot back from bench or platform with arms and body straight. Arms should be perpendicular to body. Keeping body straight, lower chest to edge of box or platform by bending arms.","Push body up until arms are extended. Repeat."],"s":"sp/Incline_Push_Up.jpg"},{"id":"Dips_-_Chest_Version","n":"Dips (pectoraux)","c":"Buste penché en avant, coudes écartés, descends jusqu'à l'étirement.","m":"Pectoraux","m2":["Triceps","Épaules"],"e":"Autre","en":"Dips - Chest Version","steps":["For this exercise you will need access to parallel bars. To get yourself into the starting position, hold your body at arms length (arms locked) above the bars.","While breathing in, lower yourself slowly with your torso leaning forward around 30 degrees or so and your elbows flared out slightly until you feel a slight stretch in the chest.","Once you feel the stretch, use your chest to bring your body back to the starting position as you breathe out. Tip: Remember to squeeze the chest at the top of the movement for a second.","Repeat the movement for the prescribed amount of repetitions."],"s":"sp/Dips___Chest_Version.jpg"},{"id":"Straight-Arm_Dumbbell_Pullover","n":"Pull-over haltère","c":"Allongé, haltère au-dessus de la poitrine, descends derrière la tête bras tendus.","m":"Pectoraux","m2":["Dos","Triceps","Épaules"],"e":"Haltères","en":"Straight-Arm Dumbbell Pullover","steps":["Place a dumbbell standing up on a flat bench.","Ensuring that the dumbbell stays securely placed at the top of the bench, lie perpendicular to the bench (torso across it as in forming a cross) with only your shoulders lying on the surface. Hips should be below the bench and legs bent with feet firmly on the floor. The head will be off the bench as well.","Grasp the dumbbell with both hands and hold it straight over your chest at arms length. Both palms should be pressing against the underside one of the sides of the dumbbell. This will be your starting position.\nCaution: Always ensure that the dumbbell used for this exercise is secure. Using a dumbbell with loose plates can result in the dumbbell falling apart and falling on your face.","While keeping your arms straight, lower the weight slowly in an arc behind your head while breathing in until you feel a stretch on the chest.","At that point, bring the dumbbell back to the starting position using the arc through which the weight was lowered and exhale as you perform this movement.","Hold the weight on the initial position for a second and repeat the motion for the prescribed number of repetitions."],"s":"sp/Straight_Arm_Dumbbell_Pullover.jpg"},{"id":"Cable_Chest_Press","n":"Développé poulie debout","c":"Dos aux poulies, pousse les poignées vers l'avant.","m":"Pectoraux","m2":["Triceps","Épaules"],"e":"Poulie","en":"Cable Chest Press","steps":["Adjust the weight to an appropriate amount and be seated, grasping the handles. Your upper arms should be about 45 degrees to the body, with your head and chest up. The elbows should be bent to about 90 degrees. This will be your starting position.","Begin by extending through the elbow, pressing the handles together straight in front of you. Keep your shoulder blades retracted as you execute the movement.","After pausing at full extension, return to th starting position, keeping tension on the cables.","You can also execute this movement with your back off the pad, at an incline or decline, or alternate hands."],"s":"sp/Cable_Chest_Press.jpg"},{"id":"Pullups","n":"Tractions pronation","c":"Prise large paumes vers l'avant, monte le menton au-dessus de la barre.","m":"Dos","m2":["Biceps"],"e":"Poids du corps","en":"Pullups","steps":["Grab the pull-up bar with the palms facing forward using the prescribed grip. Note on grips: For a wide grip, your hands need to be spaced out at a distance wider than your shoulder width. For a medium grip, your hands need to be spaced out at a distance equal to your shoulder width and for a close grip at a distance smaller than your shoulder width.","As you have both arms extended in front of you holding the bar at the chosen grip width, bring your torso back around 30 degrees or so while creating a curvature on your lower back and sticking your chest out. This is your starting position.","Pull your torso up until the bar touches your upper chest by drawing the shoulders and the upper arms down and back. Exhale as you perform this portion of the movement. Tip: Concentrate on squeezing the back muscles once you reach the full contracted position. The upper torso should remain stationary as it moves through space and only the arms should move. The forearms should do no other work other than hold the bar.","After a second on the contracted position, start to inhale and slowly lower your torso back to the starting position when your arms are fully extended and the lats are fully stretched.","Repeat this motion for the prescribed amount of repetitions."],"s":"sp/Pullups.jpg"},{"id":"Chin-Up","n":"Tractions supination","c":"Paumes vers toi, prise largeur d'épaules, poitrine vers la barre.","m":"Dos","m2":["Avant-bras","Biceps"],"e":"Poids du corps","en":"Chin-Up","steps":["Grab the pull-up bar with the palms facing your torso and a grip closer than the shoulder width.","As you have both arms extended in front of you holding the bar at the chosen grip width, keep your torso as straight as possible while creating a curvature on your lower back and sticking your chest out. This is your starting position. Tip: Keeping the torso as straight as possible maximizes biceps stimulation while minimizing back involvement.","As you breathe out, pull your torso up until your head is around the level of the pull-up bar. Concentrate on using the biceps muscles in order to perform the movement. Keep the elbows close to your body. Tip: The upper torso should remain stationary as it moves through space and only the arms should move. The forearms should do no other work other than hold the bar.","After a second of squeezing the biceps in the contracted position, slowly lower your torso back to the starting position; when your arms are fully extended. Breathe in as you perform this portion of the movement.","Repeat this motion for the prescribed amount of repetitions."],"s":"sp/Chin_Up.jpg"},{"id":"Band_Assisted_Pull-Up","n":"Tractions assistées élastique","c":"Élastique sous les genoux pour alléger le poids du corps.","m":"Dos","m2":["Abdos","Avant-bras"],"e":"Autre","en":"Band Assisted Pull-Up","steps":["Choke the band around the center of the pullup bar. You can use different bands to provide varying levels of assistance.","Pull the end of the band down, and place one bent knee into the loop, ensuring it won't slip out. Take a medium to wide grip on the bar. This will be your starting position.","Pull yourself upward by contracting the lats as you flex the elbow. The elbow should be driven to your side. Pull to the front, attempting to get your chin over the bar. Avoid swinging or jerking movements.","After a brief pause, return to the starting position."],"s":"sp/Band_Assisted_Pull_Up.jpg"},{"id":"Weighted_Pull_Ups","n":"Tractions lestées","c":"Tractions avec ceinture de lest.","m":"Dos","m2":["Biceps"],"e":"Autre","en":"Weighted Pull Ups","steps":["Attach a weight to a dip belt and secure it around your waist. Grab the pull-up bar with the palms of your hands facing forward. For a medium grip, your hands should be spaced at shoulder width. Both arms should be extended in front of you holding the bar at the chosen grip.","You'll want to bring your torso back about 30 degrees while creating a curvature in your lower back and sticking your chest out. This will be your starting position.","Now, exhale and pull your torso up until your head is above your hands. Concentrate on squeezing yourshoulder blades back and down as you reach the top contracted position.","After a brief moment at the top contracted position, inhale and slowly lower your torso back to the starting position with your arms extended and your lats fully stretched."],"s":"sp/Weighted_Pull_Ups.jpg"},{"id":"Wide-Grip_Lat_Pulldown","n":"Tirage vertical prise large","c":"Tire la barre vers le haut de la poitrine, coudes vers le bas.","m":"Dos","m2":["Biceps","Épaules"],"e":"Poulie","en":"Wide-Grip Lat Pulldown","steps":["Sit down on a pull-down machine with a wide bar attached to the top pulley. Make sure that you adjust the knee pad of the machine to fit your height. These pads will prevent your body from being raised by the resistance attached to the bar.","Grab the bar with the palms facing forward using the prescribed grip. Note on grips: For a wide grip, your hands need to be spaced out at a distance wider than shoulder width. For a medium grip, your hands need to be spaced out at a distance equal to your shoulder width and for a close grip at a distance smaller than your shoulder width.","As you have both arms extended in front of you holding the bar at the chosen grip width, bring your torso back around 30 degrees or so while creating a curvature on your lower back and sticking your chest out. This is your starting position.","As you breathe out, bring the bar down until it touches your upper chest by drawing the shoulders and the upper arms down and back. Tip: Concentrate on squeezing the back muscles once you reach the full contracted position. The upper torso should remain stationary and only the arms should move. The forearms should do no other work except for holding the bar; therefore do not try to pull down the bar using the forearms.","After a second at the contracted position squeezing your shoulder blades together, slowly raise the bar back to the starting position when your arms are fully extended and the lats are fully stretched. Inhale during this portion of the movement.","Repeat this motion for the prescribed amount of repetitions."],"s":"sp/Wide_Grip_Lat_Pulldown.jpg"},{"id":"Close-Grip_Front_Lat_Pulldown","n":"Tirage vertical prise serrée","c":"Prise serrée, tire vers la poitrine en sortant le torse.","m":"Dos","m2":["Biceps","Épaules"],"e":"Poulie","en":"Close-Grip Front Lat Pulldown","steps":["Sit down on a pull-down machine with a wide bar attached to the top pulley. Make sure that you adjust the knee pad of the machine to fit your height. These pads will prevent your body from being raised by the resistance attached to the bar.","Grab the bar with the palms facing forward using the prescribed grip. Note on grips: For a wide grip, your hands need to be spaced out at a distance wider than your shoulder width. For a medium grip, your hands need to be spaced out at a distance equal to your shoulder width and for a close grip at a distance smaller than your shoulder width.","As you have both arms extended in front of you - while holding the bar at the chosen grip width - bring your torso back around 30 degrees or so while creating a curvature on your lower back and sticking your chest out. This is your starting position.","As you breathe out, bring the bar down until it touches your upper chest by drawing the shoulders and the upper arms down and back. Tip: Concentrate on squeezing the back muscles once you reach the full contracted position. The upper torso should remain stationary (only the arms should move). The forearms should do no other work except for holding the bar; therefore do not try to pull the bar down using the forearms.","After a second in the contracted position, while squeezing your shoulder blades together, slowly raise the bar back to the starting position when your arms are fully extended and the lats are fully stretched. Inhale during this portion of the movement.","6. Repeat this motion for the prescribed amount of repetitions."],"s":"sp/Close_Grip_Front_Lat_Pulldown.jpg"},{"id":"V-Bar_Pulldown","n":"Tirage vertical poignée triangle","c":"Poignée en V, tire vers le haut du ventre/poitrine.","m":"Dos","m2":["Biceps","Épaules"],"e":"Poulie","en":"V-Bar Pulldown","steps":["Sit down on a pull-down machine with a V-Bar attached to the top pulley.","Adjust the knee pad of the machine to fit your height. These pads will prevent your body from being raised by the resistance attached to the bar.","Grab the V-bar with the palms facing each other (a neutral grip). Stick your chest out and lean yourself back slightly (around 30-degrees) in order to better engage the lats. This will be your starting position.","Using your lats, pull the bar down as you squeeze your shoulder blades. Continue until your chest nearly touches the V-bar. Exhale as you execute this motion. Tip: Keep the torso stationary throughout the movement.","After a second hold on the contracted position, slowly bring the bar back to the starting position as you breathe in.","Repeat for the prescribed number of repetitions."],"s":"sp/V_Bar_Pulldown.jpg"},{"id":"Underhand_Cable_Pulldowns","n":"Tirage vertical supination","c":"Paumes vers toi, tire vers la poitrine.","m":"Dos","m2":["Biceps","Épaules"],"e":"Poulie","en":"Underhand Cable Pulldowns","steps":["Sit down on a pull-down machine with a wide bar attached to the top pulley. Adjust the knee pad of the machine to fit your height. These pads will prevent your body from being raised by the resistance attached to the bar.","Grab the pull-down bar with the palms facing your torso (a supinated grip). Make sure that the hands are placed closer than the shoulder width.","As you have both arms extended in front of you holding the bar at the chosen grip width, bring your torso back around 30 degrees or so while creating a curvature on your lower back and sticking your chest out. This is your starting position.","As you breathe out, pull the bar down until it touches your upper chest by drawing the shoulders and the upper arms down and back. Tip: Concentrate on squeezing the back muscles once you reach the fully contracted position and keep the elbows close to your body. The upper torso should remain stationary as your bring the bar to you and only the arms should move. The forearms should do no other work other than hold the bar.","After a second on the contracted position, while breathing in, slowly bring the bar back to the starting position when your arms are fully extended and the lats are fully stretched.","Repeat this motion for the prescribed amount of repetitions."],"s":"sp/Underhand_Cable_Pulldowns.jpg"},{"id":"Straight-Arm_Pulldown","n":"Pull-over poulie bras tendus","c":"Bras tendus, ramène la barre vers les cuisses en contractant les dorsaux.","m":"Dos","m2":[],"e":"Poulie","en":"Straight-Arm Pulldown","steps":["You will start by grabbing the wide bar from the top pulley of a pulldown machine and using a wider than shoulder-width pronated (palms down) grip. Step backwards two feet or so.","Bend your torso forward at the waist by around 30-degrees with your arms fully extended in front of you and a slight bend at the elbows. If your arms are not fully extended then you need to step a bit more backwards until they are. Once your arms are fully extended and your torso is slightly bent at the waist, tighten the lats and then you are ready to begin.","While keeping the arms straight, pull the bar down by contracting the lats until your hands are next to the side of the thighs. Breathe out as you perform this step.","While keeping the arms straight, go back to the starting position while breathing in.","Repeat for the recommended amount of repetitions."],"s":"sp/Straight_Arm_Pulldown.jpg"},{"id":"Seated_Cable_Rows","n":"Tirage horizontal assis (poulie)","c":"Dos droit, tire la poignée vers le ventre, omoplates serrées.","m":"Dos","m2":["Biceps","Épaules"],"e":"Poulie","en":"Seated Cable Rows","steps":["For this exercise you will need access to a low pulley row machine with a V-bar. Note: The V-bar will enable you to have a neutral grip where the palms of your hands face each other. To get into the starting position, first sit down on the machine and place your feet on the front platform or crossbar provided making sure that your knees are slightly bent and not locked.","Lean over as you keep the natural alignment of your back and grab the V-bar handles.","With your arms extended pull back until your torso is at a 90-degree angle from your legs. Your back should be slightly arched and your chest should be sticking out. You should be feeling a nice stretch on your lats as you hold the bar in front of you. This is the starting position of the exercise.","Keeping the torso stationary, pull the handles back towards your torso while keeping the arms close to it until you touch the abdominals. Breathe out as you perform that movement. At that point you should be squeezing your back muscles hard. Hold that contraction for a second and slowly go back to the original position while breathing in.","Repeat for the recommended amount of repetitions."],"s":"sp/Seated_Cable_Rows.jpg"},{"id":"Bent_Over_Barbell_Row","n":"Rowing barre buste penché","c":"Buste à ~45°, dos plat, tire la barre vers le nombril.","m":"Dos","m2":["Biceps","Épaules"],"e":"Barre","en":"Bent Over Barbell Row","steps":["Holding a barbell with a pronated grip (palms facing down), bend your knees slightly and bring your torso forward, by bending at the waist, while keeping the back straight until it is almost parallel to the floor. Tip: Make sure that you keep the head up. The barbell should hang directly in front of you as your arms hang perpendicular to the floor and your torso. This is your starting position.","Now, while keeping the torso stationary, breathe out and lift the barbell to you. Keep the elbows close to the body and only use the forearms to hold the weight. At the top contracted position, squeeze the back muscles and hold for a brief pause.","Then inhale and slowly lower the barbell back to the starting position.","Repeat for the recommended amount of repetitions."],"s":"sp/Bent_Over_Barbell_Row.jpg"},{"id":"Reverse_Grip_Bent-Over_Rows","n":"Rowing barre supination","c":"Comme le rowing barre, paumes vers le haut.","m":"Dos","m2":["Biceps","Épaules"],"e":"Barre","en":"Reverse Grip Bent-Over Rows","steps":["Stand erect while holding a barbell with a supinated grip (palms facing up).","Bend your knees slightly and bring your torso forward, by bending at the waist, while keeping the back straight until it is almost parallel to the floor. Tip: Make sure that you keep the head up. The barbell should hang directly in front of you as your arms hang perpendicular to the floor and your torso. This is your starting position.","While keeping the torso stationary, lift the barbell as you breathe out, keeping the elbows close to the body and not doing any force with the forearm other than holding the weights. On the top contracted position, squeeze the back muscles and hold for a second.","Slowly lower the weight again to the starting position as you inhale.","Repeat for the recommended amount of repetitions."],"s":"sp/Reverse_Grip_Bent_Over_Rows.jpg"},{"id":"One-Arm_Dumbbell_Row","n":"Rowing un bras haltère","c":"Genou et main sur le banc, tire l'haltère vers la hanche.","m":"Dos","m2":["Biceps","Épaules"],"e":"Haltères","en":"One-Arm Dumbbell Row","steps":["Choose a flat bench and place a dumbbell on each side of it.","Place the right leg on top of the end of the bench, bend your torso forward from the waist until your upper body is parallel to the floor, and place your right hand on the other end of the bench for support.","Use the left hand to pick up the dumbbell on the floor and hold the weight while keeping your lower back straight. The palm of the hand should be facing your torso. This will be your starting position.","Pull the resistance straight up to the side of your chest, keeping your upper arm close to your side and keeping the torso stationary. Breathe out as you perform this step. Tip: Concentrate on squeezing the back muscles once you reach the full contracted position. Also, make sure that the force is performed with the back muscles and not the arms. Finally, the upper torso should remain stationary and only the arms should move. The forearms should do no other work except for holding the dumbbell; therefore do not try to pull the dumbbell up using the forearms.","Lower the resistance straight down to the starting position. Breathe in as you perform this step.","Repeat the movement for the specified amount of repetitions.","Switch sides and repeat again with the other arm."],"s":"sp/One_Arm_Dumbbell_Row.jpg"},{"id":"Bent_Over_Two-Dumbbell_Row","n":"Rowing deux haltères","c":"Buste penché, tire les deux haltères vers les hanches.","m":"Dos","m2":["Biceps","Épaules"],"e":"Haltères","en":"Bent Over Two-Dumbbell Row","steps":["With a dumbbell in each hand (palms facing your torso), bend your knees slightly and bring your torso forward by bending at the waist; as you bend make sure to keep your back straight until it is almost parallel to the floor. Tip: Make sure that you keep the head up. The weights should hang directly in front of you as your arms hang perpendicular to the floor and your torso. This is your starting position.","While keeping the torso stationary, lift the dumbbells to your side (as you breathe out), keeping the elbows close to the body (do not exert any force with the forearm other than holding the weights). On the top contracted position, squeeze the back muscles and hold for a second.","Slowly lower the weight again to the starting position as you inhale.","Repeat for the recommended amount of repetitions."],"s":"sp/Bent_Over_Two_Dumbbell_Row.jpg"},{"id":"Dumbbell_Incline_Row","n":"Rowing haltères sur banc incliné","c":"Poitrine sur banc incliné, tire les haltères.","m":"Dos","m2":["Avant-bras","Biceps","Épaules"],"e":"Haltères","en":"Dumbbell Incline Row","steps":["Using a neutral grip, lean into an incline bench.","Take a dumbbell in each hand with a neutral grip, beginning with the arms straight. This will be your starting position.","Retract the shoulder blades and flex the elbows to row the dumbbells to your side.","Pause at the top of the motion, and then return to the starting position."],"s":"sp/Dumbbell_Incline_Row.jpg"},{"id":"T-Bar_Row_with_Handle","n":"Rowing T-bar","c":"Buste penché, tire la poignée vers la poitrine.","m":"Dos","m2":["Biceps"],"e":"Barre","en":"T-Bar Row with Handle","steps":["Position a bar into a landmine or in a corner to keep it from moving. Load an appropriate weight onto your end.","Stand over the bar, and position a Double D row handle around the bar next to the collar. Using your hips and legs, rise to a standing position.","Assume a wide stance with your hips back and your chest up. Your arms should be extended. This will be your starting position.","Pull the weight to your upper abdomen by retracting the shoulder blades and flexing the elbows. Do not jerk the weight or cheat during the movement.","After a brief pause, return to the starting position."],"s":"sp/T_Bar_Row_with_Handle.jpg"},{"id":"Lying_T-Bar_Row","n":"Rowing T-bar allongé (machine)","c":"Poitrine sur le support, tire vers toi.","m":"Dos","m2":["Biceps"],"e":"Machine","en":"Lying T-Bar Row","steps":["Load up the T-bar Row Machine with the desired weight and adjust the leg height so that your upper chest is at the top of the pad. Tip: In some machines all you can do is stand on the appropriate step that allows you to be at a height that has the upper chest at the top of the pad.","Lay face down on the pad and grab the handles. You can either use a palms down, palms up, or palms in position depending on what part of your back you want to emphasize.","Lift the bar off the rack and extend your arms in front of you. This will be your starting position.","As you exhale slowly pull the weight up and squeeze your back at the top of the movement. Tip: Keep the upper arms as close to the torso as possible throughout the movement in order to better engage the back muscles. Also, do not lift your body off of the pad at any time and refrain from using the biceps to lift the weight.","After a second contraction at the top of the movement, as you inhale, slowly go back down to the starting position.","Repeat for the recommended amount of repetitions."],"s":"sp/Lying_T_Bar_Row.jpg"},{"id":"Leverage_High_Row","n":"Tirage haut machine","c":"Tire les poignées vers toi en serrant les omoplates.","m":"Dos","m2":[],"e":"Machine","en":"Leverage High Row","steps":["Load an appropriate weight onto the pins and adjust the seat height so that you can just reach the handles above you. Adjust the knee pad to help keep you down. Grasp the handles with a pronated grip. This will be your starting position.","Pull the handles towards your torso, retracting your shoulder blades as you flex the elbow.","Pause at the bottom of the motion, and then slowly return the handles to the starting position.","For multiple repetitions, avoid completely returning the weight to the stops to keep tension on the muscles being worked."],"s":"sp/Leverage_High_Row.jpg"},{"id":"Bodyweight_Mid_Row","n":"Rowing inversé (poids du corps)","c":"Sous une barre basse, tire la poitrine vers la barre, corps gainé.","m":"Dos","m2":["Biceps"],"e":"Autre","en":"Bodyweight Mid Row","steps":["Begin by taking a medium to wide grip on a pull-up apparatus with your palms facing away from you. From a hanging position, tuck your knees to your chest, leaning back and getting your legs over your side of the pull-up apparatus. This will be your starting position.","Beginning with your arms straight, flex the elbows and retract the shoulder blades to raise your body up until your legs contact the pull-up apparatus.","After a brief pause, return to the starting position."],"s":"sp/Bodyweight_Mid_Row.jpg"},{"id":"Face_Pull","n":"Face pull","c":"Corde à hauteur du visage, tire vers le front en écartant les mains.","m":"Épaules","m2":["Dos"],"e":"Poulie","en":"Face Pull","steps":["Facing a high pulley with a rope or dual handles attached, pull the weight directly towards your face, separating your hands as you do so. Keep your upper arms parallel to the ground."],"s":"sp/Face_Pull.jpg"},{"id":"Barbell_Deadlift","n":"Soulevé de terre","c":"Dos plat, barre près des tibias, pousse dans le sol et tends hanches et genoux.","m":"Lombaires","m2":["Avant-bras","Dos","Fessiers","Ischios","Mollets","Quadriceps","Trapèzes"],"e":"Barre","en":"Barbell Deadlift","steps":["Stand in front of a loaded barbell.","While keeping the back as straight as possible, bend your knees, bend forward and grasp the bar using a medium (shoulder width) overhand grip. This will be the starting position of the exercise. Tip: If it is difficult to hold on to the bar with this grip, alternate your grip or use wrist straps.","While holding the bar, start the lift by pushing with your legs while simultaneously getting your torso to the upright position as you breathe out. In the upright position, stick your chest out and contract the back by bringing the shoulder blades back. Think of how the soldiers in the military look when they are in standing in attention.","Go back to the starting position by bending at the knees while simultaneously leaning the torso forward at the waist while keeping the back straight. When the weights on the bar touch the floor you are back at the starting position and ready to perform another repetition.","Perform the amount of repetitions prescribed in the program."],"s":"sp/Barbell_Deadlift.jpg"},{"id":"Trap_Bar_Deadlift","n":"Soulevé de terre trap bar","c":"Debout dans la barre hexagonale, pousse avec les jambes, dos neutre.","m":"Quadriceps","m2":["Fessiers","Ischios"],"e":"Autre","en":"Trap Bar Deadlift","steps":["For this exercise load a trap bar, also known as a hex bar, to an appropriate weight resting on the ground. Stand in the center of the apparatus and grasp both handles.","Lower your hips, look forward with your head and keep your chest up.","Begin the movement by driving through the heels and extend your hips and knees. Avoid rounding your back at all times.","At the completion of the movement, lower the weight back to the ground under control."],"s":"sp/Trap_Bar_Deadlift.jpg"},{"id":"Rack_Pulls","n":"Rack pull (soulevé partiel)","c":"Barre sur supports à hauteur des genoux, verrouille les hanches.","m":"Lombaires","m2":["Avant-bras","Fessiers","Ischios","Trapèzes"],"e":"Barre","en":"Rack Pulls","steps":["Set up in a power rack with the bar on the pins. The pins should be set to the desired point; just below the knees, just above, or in the mid thigh position. Position yourself against the bar in proper deadlifting position. Your feet should be under your hips, your grip shoulder width, back arched, and hips back to engage the hamstrings. Since the weight is typically heavy, you may use a mixed grip, a hook grip, or use straps to aid in holding the weight.","With your head looking forward, extend through the hips and knees, pulling the weight up and back until lockout. Be sure to pull your shoulders back as you complete the movement.","Return the weight to the pins and repeat."],"s":"sp/Rack_Pulls.jpg"},{"id":"Hyperextensions_Back_Extensions","n":"Extensions lombaires (banc)","c":"Hanches sur le banc, descends le buste puis remonte jusqu'à l'alignement.","m":"Lombaires","m2":["Fessiers","Ischios"],"e":"Autre","en":"Hyperextensions (Back Extensions)","steps":["Lie face down on a hyperextension bench, tucking your ankles securely under the footpads.","Adjust the upper pad if possible so your upper thighs lie flat across the wide pad, leaving enough room for you to bend at the waist without any restriction.","With your body straight, cross your arms in front of you (my preference) or behind your head. This will be your starting position. Tip: You can also hold a weight plate for extra resistance in front of you under your crossed arms.","Start bending forward slowly at the waist as far as you can while keeping your back flat. Inhale as you perform this movement. Keep moving forward until you feel a nice stretch on the hamstrings and you can no longer keep going without a rounding of the back. Tip: Never round the back as you perform this exercise. Also, some people can go farther than others. The key thing is that you go as far as your body allows you to without rounding the back.","Slowly raise your torso back to the initial position as you inhale. Tip: Avoid the temptation to arch your back past a straight line. Also, do not swing the torso at any time in order to protect the back from injury.","Repeat for the recommended amount of repetitions."],"s":"sp/Hyperextensions_Back_Extensions.jpg"},{"id":"Good_Morning","n":"Good morning","c":"Barre sur le dos, genoux souples, penche le buste dos plat puis remonte.","m":"Ischios","m2":["Abdos","Fessiers","Lombaires"],"e":"Barre","en":"Good Morning","steps":["Begin with a bar on a rack at shoulder height. Rack the bar across the rear of your shoulders as you would a power squat, not on top of your shoulders. Keep your back tight, shoulder blades pinched together, and your knees slightly bent. Step back from the rack.","Begin by bending at the hips, moving them back as you bend over to near parallel. Keep your back arched and your cervical spine in proper alignment.","Reverse the motion by extending through the hips with your glutes and hamstrings. Continue until you have returned to the starting position."],"s":"sp/Good_Morning.jpg"},{"id":"Barbell_Shrug","n":"Haussements d'épaules barre","c":"Bras tendus, monte les épaules vers les oreilles, pause, redescends.","m":"Trapèzes","m2":[],"e":"Barre","en":"Barbell Shrug","steps":["Stand up straight with your feet at shoulder width as you hold a barbell with both hands in front of you using a pronated grip (palms facing the thighs). Tip: Your hands should be a little wider than shoulder width apart. You can use wrist wraps for this exercise for a better grip. This will be your starting position.","Raise your shoulders up as far as you can go as you breathe out and hold the contraction for a second. Tip: Refrain from trying to lift the barbell by using your biceps.","Slowly return to the starting position as you breathe in.","Repeat for the recommended amount of repetitions."],"s":"sp/Barbell_Shrug.jpg"},{"id":"Dumbbell_Shrug","n":"Haussements d'épaules haltères","c":"Haltères le long du corps, monte les épaules.","m":"Trapèzes","m2":[],"e":"Haltères","en":"Dumbbell Shrug","steps":["Stand erect with a dumbbell on each hand (palms facing your torso), arms extended on the sides.","Lift the dumbbells by elevating the shoulders as high as possible while you exhale. Hold the contraction at the top for a second. Tip: The arms should remain extended at all times. Refrain from using the biceps to help lift the dumbbells. Only the shoulders should be moving up and down.","Lower the dumbbells back to the original position.","Repeat for the recommended amount of repetitions."],"s":"sp/Dumbbell_Shrug.jpg"},{"id":"Standing_Military_Press","n":"Développé militaire debout","c":"Barre devant le cou, pousse au-dessus de la tête, fessiers et abdos serrés.","m":"Épaules","m2":["Triceps"],"e":"Barre","en":"Standing Military Press","steps":["Start by placing a barbell that is about chest high on a squat rack. Once you have selected the weights, grab the barbell using a pronated (palms facing forward) grip. Make sure to grip the bar wider than shoulder width apart from each other.","Slightly bend the knees and place the barbell on your collar bone. Lift the barbell up keeping it lying on your chest. Take a step back and position your feet shoulder width apart from each other.","Once you pick up the barbell with the correct grip length, lift the bar up over your head by locking your arms. Hold at about shoulder level and slightly in front of your head. This is your starting position.","Lower the bar down to the collarbone slowly as you inhale.","Lift the bar back up to the starting position as you exhale.","Repeat for the recommended amount of repetitions."],"s":"sp/Standing_Military_Press.jpg"},{"id":"Seated_Barbell_Military_Press","n":"Développé militaire assis","c":"Assis dos calé, pousse la barre au-dessus de la tête.","m":"Épaules","m2":["Triceps"],"e":"Barre","en":"Seated Barbell Military Press","steps":["Sit on a Military Press Bench with a bar behind your head and either have a spotter give you the bar (better on the rotator cuff this way) or pick it up yourself carefully with a pronated grip (palms facing forward). Tip: Your grip should be wider than shoulder width and it should create a 90-degree angle between the forearm and the upper arm as the barbell goes down.","Once you pick up the barbell with the correct grip length, lift the bar up over your head by locking your arms. Hold at about shoulder level and slightly in front of your head. This is your starting position.","Lower the bar down to the collarbone slowly as you inhale.","Lift the bar back up to the starting position as you exhale.","Repeat for the recommended amount of repetitions."],"s":"sp/Seated_Barbell_Military_Press.jpg"},{"id":"Dumbbell_Shoulder_Press","n":"Développé épaules haltères","c":"Haltères à hauteur d'oreilles, pousse au-dessus de la tête.","m":"Épaules","m2":["Triceps"],"e":"Haltères","en":"Dumbbell Shoulder Press","steps":["While holding a dumbbell in each hand, sit on a military press bench or utility bench that has back support. Place the dumbbells upright on top of your thighs.","Now raise the dumbbells to shoulder height one at a time using your thighs to help propel them up into position.","Make sure to rotate your wrists so that the palms of your hands are facing forward. This is your starting position.","Now, exhale and push the dumbbells upward until they touch at the top.","Then, after a brief pause at the top contracted position, slowly lower the weights back down to the starting position while inhaling.","Repeat for the recommended amount of repetitions."],"s":"sp/Dumbbell_Shoulder_Press.jpg"},{"id":"Seated_Dumbbell_Press","n":"Développé haltères assis","c":"Assis dos droit, pousse les haltères vers le haut.","m":"Épaules","m2":["Triceps"],"e":"Haltères","en":"Seated Dumbbell Press","steps":["Grab a couple of dumbbells and sit on a military press bench or a utility bench that has a back support on it as you place the dumbbells upright on top of your thighs.","Clean the dumbbells up one at a time by using your thighs to bring the dumbbells up to shoulder height at each side.","Rotate the wrists so that the palms of your hands are facing forward. This is your starting position.","As you exhale, push the dumbbells up until they touch at the top.","After a second pause, slowly come down back to the starting position as you inhale.","Repeat for the recommended amount of repetitions."],"s":"sp/Seated_Dumbbell_Press.jpg"},{"id":"Arnold_Dumbbell_Press","n":"Développé Arnold","c":"Paumes vers toi en bas, tourne les poignets en poussant vers le haut.","m":"Épaules","m2":["Triceps"],"e":"Haltères","en":"Arnold Dumbbell Press","steps":["Sit on an exercise bench with back support and hold two dumbbells in front of you at about upper chest level with your palms facing your body and your elbows bent. Tip: Your arms should be next to your torso. The starting position should look like the contracted portion of a dumbbell curl.","Now to perform the movement, raise the dumbbells as you rotate the palms of your hands until they are facing forward.","Continue lifting the dumbbells until your arms are extended above you in straight arm position. Breathe out as you perform this portion of the movement.","After a second pause at the top, begin to lower the dumbbells to the original position by rotating the palms of your hands towards you. Tip: The left arm will be rotated in a counter clockwise manner while the right one will be rotated clockwise. Breathe in as you perform this portion of the movement.","Repeat for the recommended amount of repetitions."],"s":"sp/Arnold_Dumbbell_Press.jpg"},{"id":"Machine_Shoulder_Military_Press","n":"Développé épaules machine","c":"Poignées à hauteur d'épaules, pousse vers le haut.","m":"Épaules","m2":["Triceps"],"e":"Machine","en":"Machine Shoulder (Military) Press","steps":["Sit down on the Shoulder Press Machine and select the weight.","Grab the handles to your sides as you keep the elbows bent and in line with your torso. This will be your starting position.","Now lift the handles as you exhale and you extend the arms fully. At the top of the position make sure that you hold the contraction for a second.","Lower the handles slowly back to the starting position as you inhale.","Repeat for the recommended amount of repetitions."],"s":"sp/Machine_Shoulder_Military_Press.jpg"},{"id":"Side_Lateral_Raise","n":"Élévations latérales","c":"Bras légèrement fléchis, monte les haltères sur les côtés jusqu'aux épaules.","m":"Épaules","m2":[],"e":"Haltères","en":"Side Lateral Raise","steps":["Pick a couple of dumbbells and stand with a straight torso and the dumbbells by your side at arms length with the palms of the hand facing you. This will be your starting position.","While maintaining the torso in a stationary position (no swinging), lift the dumbbells to your side with a slight bend on the elbow and the hands slightly tilted forward as if pouring water in a glass. Continue to go up until you arms are parallel to the floor. Exhale as you execute this movement and pause for a second at the top.","Lower the dumbbells back down slowly to the starting position as you inhale.","Repeat for the recommended amount of repetitions."],"s":"sp/Side_Lateral_Raise.jpg"},{"id":"Cable_Seated_Lateral_Raise","n":"Élévation latérale poulie","c":"Poulie basse, monte le bras sur le côté.","m":"Épaules","m2":["Dos","Trapèzes"],"e":"Poulie","en":"Cable Seated Lateral Raise","steps":["Stand in the middle of two low pulleys that are opposite to each other and place a flat bench right behind you (in perpendicular fashion to you; the narrow edge of the bench should be the one behind you). Select the weight to be used on each pulley.","Now sit at the edge of the flat bench behind you with your feet placed in front of your knees.","Bend forward while keeping your back flat and rest your torso on the thighs.","Have someone give you the single handles attached to the pulleys. Grasp the left pulley with the right hand and the right pulley with the left after you select your weight. The pulleys should run under your knees and your arms will be extended with palms facing each other and a slight bend at the elbows. This will be the starting position.","While keeping the arms stationary, raise the upper arms to the sides until they are parallel to the floor and at shoulder height. Exhale during the execution of this movement and hold the contraction for a second.","Slowly lower your arms to the starting position as you inhale.","Repeat for the recommended amount of repetitions. Tip: Maintain upper arms perpendicular to torso and a fixed elbow position (10 degree to 30 degree angle) throughout exercise."],"s":"sp/Cable_Seated_Lateral_Raise.jpg"},{"id":"Front_Dumbbell_Raise","n":"Élévations frontales haltères","c":"Monte les haltères devant toi jusqu'à hauteur d'yeux.","m":"Épaules","m2":[],"e":"Haltères","en":"Front Dumbbell Raise","steps":["Pick a couple of dumbbells and stand with a straight torso and the dumbbells on front of your thighs at arms length with the palms of the hand facing your thighs. This will be your starting position.","While maintaining the torso stationary (no swinging), lift the left dumbbell to the front with a slight bend on the elbow and the palms of the hands always facing down. Continue to go up until you arm is slightly above parallel to the floor. Exhale as you execute this portion of the movement and pause for a second at the top. Inhale after the second pause.","Now lower the dumbbell back down slowly to the starting position as you simultaneously lift the right dumbbell.","Continue alternating in this fashion until all of the recommended amount of repetitions have been performed for each arm."],"s":"sp/Front_Dumbbell_Raise.jpg"},{"id":"Front_Plate_Raise","n":"Élévation frontale disque","c":"Disque tenu à deux mains, monte devant toi.","m":"Épaules","m2":[],"e":"Autre","en":"Front Plate Raise","steps":["While standing straight, hold a barbell plate in both hands at the 3 and 9 o'clock positions. Your palms should be facing each other and your arms should be extended and locked with a slight bend at the elbows and the plate should be down near your waist in front of you as far as you can go. Tip: The arms will remain in this position throughout the exercise. This will be your starting position.","Slowly raise the plate as you exhale until it is a little above shoulder level. Hold the contraction for a second. Tip: make sure that you do not swing the weight or bend at the elbows. Your torso should remain stationary throughout the movement as well.","As you inhale, slowly lower the plate back down to the starting position.","Repeat for the recommended amount of repetitions."],"s":"sp/Front_Plate_Raise.jpg"},{"id":"Reverse_Flyes","n":"Oiseau haltères","c":"Buste penché, ouvre les bras sur les côtés (arrière d'épaule).","m":"Épaules","m2":[],"e":"Haltères","en":"Reverse Flyes","steps":["To begin, lie down on an incline bench with the chest and stomach pressing against the incline. Have the dumbbells in each hand with the palms facing each other (neutral grip).","Extend the arms in front of you so that they are perpendicular to the angle of the bench. The legs should be stationary while applying pressure with the ball of your toes. This is the starting position.","Maintaining the slight bend of the elbows, move the weights out and away from each other (to the side) in an arc motion while exhaling. Tip: Try to squeeze your shoulder blades together to get the best results from this exercise.","The arms should be elevated until they are parallel to the floor.","Feel the contraction and slowly lower the weights back down to the starting position while inhaling.","Repeat for the recommended amount of repetitions."],"s":"sp/Reverse_Flyes.jpg"},{"id":"Reverse_Machine_Flyes","n":"Oiseau machine (reverse pec deck)","c":"Face à la machine, écarte les bras vers l'arrière.","m":"Épaules","m2":[],"e":"Machine","en":"Reverse Machine Flyes","steps":["Adjust the handles so that they are fully to the rear. Make an appropriate weight selection and adjust the seat height so the handles are at shoulder level. Grasp the handles with your hands facing inwards. This will be your starting position.","In a semicircular motion, pull your hands out to your side and back, contracting your rear delts.","Keep your arms slightly bent throughout the movement, with all of the motion occurring at the shoulder joint.","Pause at the rear of the movement, and slowly return the weight to the starting position."],"s":"sp/Reverse_Machine_Flyes.jpg"},{"id":"Cable_Rear_Delt_Fly","n":"Oiseau poulie","c":"Poulies croisées, écarte les bras vers l'arrière.","m":"Épaules","m2":[],"e":"Poulie","en":"Cable Rear Delt Fly","steps":["Adjust the pulleys to the appropriate height and adjust the weight. The pulleys should be above your head.","Grab the left pulley with your right hand and the right pulley with your left hand, crossing them in front of you. This will be your starting position.","Initiate the movement by moving your arms back and outward, keeping your arms straight as you execute the movement.","Pause at the end of the motion before returning the handles to the start position."],"s":"sp/Cable_Rear_Delt_Fly.jpg"},{"id":"Upright_Barbell_Row","n":"Rowing menton barre","c":"Tire la barre le long du corps jusqu'à la poitrine, coudes hauts.","m":"Épaules","m2":["Trapèzes"],"e":"Barre","en":"Upright Barbell Row","steps":["Grasp a barbell with an overhand grip that is slightly less than shoulder width. The bar should be resting on the top of your thighs with your arms extended and a slight bend in your elbows. Your back should also be straight. This will be your starting position.","Now exhale and use the sides of your shoulders to lift the bar, raising your elbows up and to the side. Keep the bar close to your body as you raise it. Continue to lift the bar until it nearly touches your chin. Tip: Your elbows should drive the motion, and should always be higher than your forearms. Remember to keep your torso stationary and pause for a second at the top of the movement.","Lower the bar back down slowly to the starting position. Inhale as you perform this portion of the movement.","Repeat for the recommended amount of repetitions."],"s":"sp/Upright_Barbell_Row.jpg"},{"id":"External_Rotation_with_Cable","n":"Rotation externe poulie","c":"Coude collé au corps, tourne l'avant-bras vers l'extérieur.","m":"Épaules","m2":[],"e":"Poulie","en":"External Rotation with Cable","steps":["Adjust the cable to the same height as your elbow. Stand with your left side to the band a couple of feet away.","Grasp the handle with your right hand, and keep your elbow pressed firmly to your side. We recommend you hold a pad or foam roll in place with your elbow to keep it firmly in position.","With your upper arm in position, your elbow should be flexed to 90 degrees with your hand reaching across the front of your torso. This will be your starting position.","Execute the movement by rotating your arm in a backhand motion, keeping your elbow in place."],"s":"sp/External_Rotation_with_Cable.jpg"},{"id":"Barbell_Curl","n":"Curl barre","c":"Coudes fixes le long du corps, monte la barre sans balancer.","m":"Biceps","m2":["Avant-bras"],"e":"Barre","en":"Barbell Curl","steps":["Stand up with your torso upright while holding a barbell at a shoulder-width grip. The palm of your hands should be facing forward and the elbows should be close to the torso. This will be your starting position.","While holding the upper arms stationary, curl the weights forward while contracting the biceps as you breathe out. Tip: Only the forearms should move.","Continue the movement until your biceps are fully contracted and the bar is at shoulder level. Hold the contracted position for a second and squeeze the biceps hard.","Slowly begin to bring the bar back to starting position as your breathe in.","Repeat for the recommended amount of repetitions."],"s":"sp/Barbell_Curl.jpg"},{"id":"EZ-Bar_Curl","n":"Curl barre EZ","c":"Barre coudée pour soulager les poignets, coudes fixes.","m":"Biceps","m2":[],"e":"Barre EZ","en":"EZ-Bar Curl","steps":["Stand up straight while holding an EZ curl bar at the wide outer handle. The palms of your hands should be facing forward and slightly tilted inward due to the shape of the bar. Keep your elbows close to your torso. This will be your starting position.","Now, while keeping your upper arms stationary, exhale and curl the weights forward while contracting the biceps. Focus on only moving your forearms.","Continue to raise the weight until your biceps are fully contracted and the bar is at shoulder level. Hold the top contracted position for a moment and squeeze the biceps.","Then inhale and slowly lower the bar back to the starting position.","Repeat for the recommended amount of repetitions."],"s":"sp/EZ_Bar_Curl.jpg"},{"id":"Dumbbell_Bicep_Curl","n":"Curl haltères","c":"Monte les haltères en tournant les paumes vers le haut.","m":"Biceps","m2":["Avant-bras"],"e":"Haltères","en":"Dumbbell Bicep Curl","steps":["Stand up straight with a dumbbell in each hand at
